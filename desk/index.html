  function getGraphDataset() {
    const isReplay = S.replaySeq !== null;
    if (isReplay) {
      const rp = S.replay;
      const members = rp ? rp.members : [];
      const nodes = members.map((m) => ({ key: memberKey(m), raw: m, live: false, st: classifyState(m, true) }));
      const proof = new Set((rp?.events || []).filter(event => event.type === 'message_delivery' &&
        event.messageId && (!event.delivery || event.delivery === 'delivered')).map(event => String(event.messageId)));
      const messages = rp ? aggregateHistoryMessages(rp.events, S.replaySeq).map(message => ({
        ...message, confirmedDelivered: proof.has(message.id)
      })) : [];
      const { edges, externalEdges } = buildEdges(nodes, messages);
      return {
        isReplay: true,
        fallbackHistLive: false,
        nodes, messages, edges, externalEdges,
        seq: S.replaySeq,
        eventAt: rp && rp.atEvent ? rp.atEvent.at : null,
        atEvent: rp ? rp.atEvent : null,
        recordingSince: rp ? rp.recordingSince : S.hist.recordingSince
      };
    }
    const useLive = groupIsLive() && !S.error;
    const liveTasks = useLive ? S.board.tasks : [];
    const fallbackHistLive = !useLive && (S.hist.members || []).length > 0;
    const nodes = useLive
      ? liveTasks.map((t) => ({ key: memberKey(t), raw: t, live: true, st: classifyState(t, false) }))
      : (S.hist.members || []).map((m) => ({ key: memberKey(m), raw: m, live: false, st: classifyState(m, true) }));
    const messages = fallbackHistLive ? aggregateHistoryMessages(S.hist.events, null) : normalizeLiveMessages(S.board.peerEvents, S.group);
    const { edges, externalEdges } = buildEdges(nodes, messages);
    return {
      isReplay: false,
      useLive,
      fallbackHistLive,
      nodes, messages, edges, externalEdges,
      seq: S.hist.head,
      eventAt: S.lastBoardAt || null,
      atEvent: null,
      recordingSince: S.hist.recordingSince
    };
  }

  function drawHoneycombCanvas(canvas, w, h, nodes, edges, selKey) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const theme = getComputedStyle(canvas);
    const graphColor = name => theme.getPropertyValue('--denia-graph-' + name).trim();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2, cy = h / 2;
    const rOuter = Math.min(w * 0.34, h * 0.35, 215);

    ctx.save();
    ctx.strokeStyle = graphColor('guide');
    ctx.lineWidth = 1;
    for (const scale of [0.55, 1, 1.32]) {
      const rr = rOuter * scale;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 3;
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();

    const pos = new Map();
    nodes.forEach((n) => pos.set(n.key, n.pos));

    ctx.save();
    ctx.setLineDash([4, 5]);
    ctx.lineWidth = 1.25;
    for (const n of nodes) {
      const hi = selKey && selKey === n.key;
      ctx.strokeStyle = graphColor(hi ? 'spoke-active' : 'spoke');
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(n.pos.x, n.pos.y);
      ctx.stroke();
    }
    ctx.restore();

    const pairExists = new Set(edges.map((e) => e.fromKey + '->' + e.toKey));
    for (const e of edges) {
      const p1 = pos.get(e.fromKey), p2 = pos.get(e.toKey);
      if (!p1 || !p2) continue;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const dist = Math.hypot(dx, dy) || 1;
      const ux = dx / dist, uy = dy / dist;
      const padStart = 42, padEnd = 46;
      const sx = p1.x + ux * padStart, sy = p1.y + uy * padStart;
      const ex = p2.x - ux * padEnd, ey = p2.y - uy * padEnd;
      const bidir = pairExists.has(e.toKey + '->' + e.fromKey);
      const bend = bidir ? 28 : 16;
      const nx = -uy, ny = ux;
      const mx = (sx + ex) / 2 + nx * bend;
      const my = (sy + ey) / 2 + ny * bend;
      const active = selKey && (selKey === e.fromKey || selKey === e.toKey);
      const color = graphColor(active ? 'edge-active' : (e.confirmed ? 'confirmed' : 'edge'));

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = active ? 2.4 : 1.75;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      const arrived = S.replaySeq === null || e.confirmed > 0;
      if (arrived) ctx.quadraticCurveTo(mx, my, ex, ey);
      else {
        ctx.setLineDash([4, 4]);
        ctx.lineTo(sx + (mx - sx) * 0.42, sy + (my - sy) * 0.42);
      }
      ctx.stroke();
      if (!arrived) {
        ctx.restore();
        continue;
      }

      const tx = ex - mx, ty = ey - my;
      const ang = Math.atan2(ty, tx);
      const ah = 9;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - ah * Math.cos(ang - 0.42), ey - ah * Math.sin(ang - 0.42));
      ctx.lineTo(ex - ah * Math.cos(ang + 0.42), ey - ah * Math.sin(ang + 0.42));
      ctx.closePath();
      ctx.fill();

      const lx = 0.25 * sx + 0.5 * mx + 0.25 * ex;
      const ly = 0.25 * sy + 0.5 * my + 0.25 * ey;
      const label = e.count + '条';
      ctx.font = '600 11px ' + getComputedStyle(document.body).fontFamily;
      const tw = ctx.measureText(label).width + 10;
      ctx.fillStyle = graphColor('edge-paper');
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(lx - tw / 2, ly - 9, tw, 18, 9);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = graphColor('edge-ink');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, lx, ly + 0.5);
      ctx.restore();
    }
    let visual = null;
    if (S.replaySeq !== null) {
      const snapshot = S.replay?.seq === S.replaySeq ? S.replay : null;
      visual = buildTraceVisual(snapshot);
    } else {
      const latestEv = historyTraceSteps(S.hist.events).at(-1) || null;
      if (latestEv) visual = buildTraceVisual({ atEvent: latestEv, events: S.hist.events });
    }
    if (visual) drawTraceEvidenceOverlay(ctx, nodes,
      TRACE.fx?.visual.seq === visual.seq ? TRACE.fx : { visual, reduced: true }, performance.now());
  }

  function realMessageId(event) {
    return event?.messageId ? String(event.messageId) : '';
  }

  function captionEventTime(ev) {
    if (!ev) return { label: '观测时间', value: '未知' };
    if (ev.type === 'message_sent' || ev.type === 'message_reply') {
      if (ev.sentAt) return { label: '发信时间', value: fmtDateTime(ev.sentAt) };
      return { label: '观测时间', value: ev.at ? fmtDateTime(ev.at) : '未知' };
    }
    if (ev.type === 'message_delivery') {
      if (ev.receiptAt) return { label: '投递时间', value: fmtDateTime(ev.receiptAt) };
      return { label: '观测时间', value: ev.at ? fmtDateTime(ev.at) : '未知' };
    }
    if (ev.type === 'message_read') {
      if (ev.readAt) return { label: '取信时间', value: fmtDateTime(ev.readAt) };
      return { label: '观测时间', value: ev.at ? fmtDateTime(ev.at) : '未知' };
    }
    return { label: '观测时间', value: ev.at ? fmtDateTime(ev.at) : '未知' };
  }

  function stageBadgeMeta(type) {
    if (type === 'message_sent') return { text: '发信', cls: 'trace-chip-sent' };
    if (type === 'message_reply') return { text: '回信', cls: 'trace-chip-reply' };
    if (type === 'message_delivery') return { text: '投递', cls: 'trace-chip-delivery' };
    if (type === 'message_read') return { text: '取信', cls: 'trace-chip-read' };
    return { text: eventTypeLabel(type), cls: 'trace-chip-other' };
  }

  function findSameMessagePrior(events, messageId, maxSeq) {
    if (!messageId) return null;
    let from = '', to = '', fromActorId = '', toActorId = '';
    for (const ev of events || []) {
      if (!ev || Number(ev.seq) > Number(maxSeq)) continue;
      if (realMessageId(ev) !== String(messageId)) continue;
      if (ev.from) from = ev.from;
      if (ev.to) to = ev.to;
      if (ev.fromActorId) fromActorId = ev.fromActorId;
      if (ev.toActorId) toActorId = ev.toActorId;
    }
    return { from, to, fromActorId, toActorId };
  }

  function findCanvasNode(nodes, name, actorId) {
    const key = buildNodeLookup(nodes)(actorId, name);
    return nodes.find(node => node.key === key) || null;
  }

  function buildTraceVisual(replay) {
    if (!replay || !replay.atEvent) return null;
    const ev = replay.atEvent;
    const seq = Number(ev.seq);
    const mid = realMessageId(ev);
    const t = ev.type;
    const timeCap = captionEventTime(ev);

    if (t === 'message_sent' || t === 'message_reply') {
      // Source ONLY; direction uses this event's own from/to (never guessed from replyTo parent)
      const fromName = ev.from || ev.fromActorId || '';
      const toName = ev.to || ev.toActorId || '';
      return {
        key: seq,
        seq,
        kind: t === 'message_reply' ? 'reply_source' : 'send_source',
        type: t,
        messageId: mid,
        replyTo: ev.replyTo ? String(ev.replyTo) : '',
        from: fromName,
        fromActorId: ev.fromActorId || '',
        to: toName,
        toActorId: ev.toActorId || '',
        recipient: '',
        recipientActorId: '',
        eligibleDelivery: false,
        timeCap,
        summary: ev.summary || ev.text || ''
      };
    }

    if (t === 'message_delivery') {
      // Eligible from -> to ONLY from this event or same-messageId prior events at <= seq (never replyTo)
      const prior = findSameMessagePrior(replay.events, mid, seq);
      const fromName = ev.from || ev.fromActorId || (prior && (prior.from || prior.fromActorId)) || '';
      const toName = ev.to || ev.toActorId || (prior && (prior.to || prior.toActorId)) || '';
      const fromActorId = ev.fromActorId || (prior && prior.fromActorId) || '';
      const toActorId = ev.toActorId || (prior && prior.toActorId) || '';
      const dStr = ev.delivery ? String(ev.delivery).toLowerCase() : 'delivered';
      const eligible = Boolean(mid && (!ev.delivery || dStr === 'delivered') && fromName && toName);
      return {
        key: seq,
        seq,
        kind: eligible ? 'delivery_arrow' : 'delivery_text_only',
        type: t,
        messageId: mid,
        replyTo: '',
        from: fromName,
        fromActorId,
        to: toName,
        toActorId,
        recipient: toName,
        recipientActorId: toActorId,
        eligibleDelivery: eligible,
        deliveryLabel: ev.delivery || 'delivered',
        timeCap,
        summary: ''
      };
    }

    if (t === 'message_read') {
      // Pulses observed recipient ONLY; never swaps direction
      const prior = findSameMessagePrior(replay.events, mid, seq);
      const recipient = ev.to || ev.toActorId || (prior && (prior.to || prior.toActorId)) || '';
      const recipientActorId = ev.toActorId || (prior && prior.toActorId) || '';
      return {
        key: seq,
        seq,
        kind: 'read_pulse',
        type: t,
        messageId: mid,
        replyTo: '',
        from: '',
        fromActorId: '',
        to: recipient,
        toActorId: recipientActorId,
        recipient,
        recipientActorId,
        eligibleDelivery: false,
        timeCap,
        summary: ''
      };
    }

    return {
      key: seq,
      seq,
      kind: 'other',
      type: t,
      messageId: mid,
      replyTo: '',
      from: ev.from || '',
      fromActorId: ev.fromActorId || '',
      to: ev.to || '',
      toActorId: ev.toActorId || '',
      recipient: '',
      recipientActorId: '',
      eligibleDelivery: false,
      timeCap,
      summary: eventSummary(ev)
    };
  }

  function drawTraceEvidenceOverlay(ctx, nodes, fxState, nowMs) {
    if (!ctx || !fxState || !fxState.visual || !Array.isArray(nodes) || !nodes.length) return;
    const v = fxState.visual;
    const dark = document.documentElement.dataset.deskMode === 'night';
    const p = fxState.reduced || fxState.durationMs <= 0
      ? 1
      : Math.max(0, Math.min(1, ((nowMs ?? performance.now()) - fxState.startMs) / fxState.durationMs));
    const ease = 1 - Math.pow(1 - p, 3);

    const colorSent = v.kind === 'reply_source' ? (dark ? '#7cc0ff' : '#2463a8') : (dark ? '#f5b963' : '#b86b14');
    const colorDelivery = dark ? '#67d69a' : '#1f7a4c';
    const colorRead = dark ? '#c4a7ff' : '#6b46a8';

    ctx.save();

    if (v.kind === 'send_source' || v.kind === 'reply_source') {
      const src = findCanvasNode(nodes, v.from, v.fromActorId);
      if (!src || !src.pos) { ctx.restore(); return; } // Unlisted participant: text only
      const r = Number(src.r || src.radius || 37);

      // 1. Mark source ONLY
      ctx.strokeStyle = colorSent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(src.pos.x, src.pos.y, r + 5, 0, Math.PI * 2);
      ctx.stroke();

      if (!fxState.reduced && p < 1) {
        ctx.globalAlpha = (1 - p) * 0.55;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(src.pos.x, src.pos.y, r + 6 + 12 * ease, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // 2. Optional short front-of-path direction hint ONLY (never reaches or marks target)
      const dst = findCanvasNode(nodes, v.to, v.toActorId);
      if (dst && dst.pos && dst !== src) {
        const dx = dst.pos.x - src.pos.x;
        const dy = dst.pos.y - src.pos.y;
        const dist = Math.hypot(dx, dy);
        if (dist > r * 2 + 12) {
          const ux = dx / dist, uy = dy / dist;
          const startX = src.pos.x + ux * (r + 7);
          const startY = src.pos.y + uy * (r + 7);
          const stubLen = Math.min(34, (dist - r * 2) * 0.25) * ease;
          const endX = startX + ux * stubLen;
          const endY = startY + uy * stubLen;
          ctx.strokeStyle = colorSent;
          ctx.lineWidth = 2.5;
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      ctx.restore();
      return;
    }

    if (v.kind === 'delivery_arrow' && v.eligibleDelivery) {
      const src = findCanvasNode(nodes, v.from, v.fromActorId);
      const dst = findCanvasNode(nodes, v.to, v.toActorId);
      if (!src || !src.pos || !dst || !dst.pos || src === dst) { ctx.restore(); return; } // Missing/unlisted: text only
      const rSrc = Number(src.r || src.radius || 37);
      const rDst = Number(dst.r || dst.radius || 37);
      const dx = dst.pos.x - src.pos.x;
      const dy = dst.pos.y - src.pos.y;
      const dist = Math.hypot(dx, dy);
      if (dist <= rSrc + rDst + 4) { ctx.restore(); return; }

      const ux = dx / dist, uy = dy / dist;
      const x1 = src.pos.x + ux * (rSrc + 4);
      const y1 = src.pos.y + uy * (rSrc + 4);
      const x2 = dst.pos.x - ux * (rDst + 6);
      const y2 = dst.pos.y - uy * (rDst + 6);
      const bend = Math.min(145, dist * 0.36);
      const mx = (x1 + x2) / 2 - uy * bend;
      const my = (y1 + y2) / 2 + ux * bend;
      const qx = x1 + (mx - x1) * ease;
      const qy = y1 + (my - y1) * ease;
      const rx = mx + (x2 - mx) * ease;
      const ry = my + (y2 - my) * ease;
      const cx = qx + (rx - qx) * ease;
      const cy = qy + (ry - qy) * ease;

      ctx.strokeStyle = colorDelivery;
      ctx.fillStyle = colorDelivery;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(qx, qy, cx, cy);
      ctx.stroke();

      // Arrowhead reaches endpoint
      const angle = Math.atan2(ry - qy, rx - qx);
      const headLen = 10;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx - headLen * Math.cos(angle - Math.PI / 6), cy - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(cx - headLen * Math.cos(angle + Math.PI / 6), cy - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      // Endpoint arrival ring when eligible delivery arrives
      if (p >= 0.85) {
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(dst.pos.x, dst.pos.y, rDst + 5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }

    if (v.kind === 'read_pulse') {
      const rec = findCanvasNode(nodes, v.recipient, v.recipientActorId);
      if (!rec || !rec.pos) { ctx.restore(); return; } // Unlisted recipient: text only
      const r = Number(rec.r || rec.radius || 37);

      ctx.strokeStyle = colorRead;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(rec.pos.x, rec.pos.y, r + 5, 0, Math.PI * 2);
      ctx.stroke();

      if (!fxState.reduced && p < 1) {
        ctx.globalAlpha = (1 - p) * 0.6;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(rec.pos.x, rec.pos.y, r + 6 + 14 * ease, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
  }

  const TRACE = { generation: 0, playing: false, filling: false, timer: null, frame: null, fx: null, scrubbing: false, pendingIndex: null };
  const traceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const traceStageTypes = new Set(['message_sent', 'message_reply', 'message_delivery', 'message_read']);

  function pauseDeskTrace() {
    TRACE.generation++;
    TRACE.playing = false;
    TRACE.filling = false;
    TRACE.scrubbing = false;
    TRACE.pendingIndex = null;
    clearTimeout(TRACE.timer);
    cancelAnimationFrame(TRACE.frame);
    TRACE.timer = TRACE.frame = TRACE.fx = null;
  }

  function startTraceEffect(snapshot) {
    cancelAnimationFrame(TRACE.frame);
    const visual = buildTraceVisual(snapshot);
    if (!visual || visual.kind === 'other' || visual.kind === 'delivery_text_only') {
      TRACE.fx = null;
      return;
    }
    const reduced = traceMotion.matches || S.graphWidth > 0 && S.graphWidth < 740 || snapshot.members.length > 6;
    const fx = { visual, startMs: performance.now(), durationMs: 360, reduced };
    TRACE.fx = fx;
    if (reduced) return;
    const redraw = now => {
      if (TRACE.fx !== fx || S.tab !== 'graph' || S.replaySeq !== visual.seq) return;
      repaintDeskGraph?.();
      TRACE.frame = now - fx.startMs < fx.durationMs ? requestAnimationFrame(redraw) : null;
    };
    TRACE.frame = requestAnimationFrame(redraw);
  }

  function historyTraceSteps(events) {
    return (events || []).filter(event => traceStageTypes.has(event.type) && event.messageId && Number.isSafeInteger(event.seq));
  }

  function traceHistoryReady() {
    return S.hist.loaded && !S.hist.hasMore && !S.hist.error;
  }

  async function prepareDeskTrace(reqId) {
    if (traceHistoryReady()) return reqId === S.groupReqId;
    if (S.hist.loading) return false;
    await loadHistory(S.group, reqId, S.hist.loaded && S.hist.hasMore && !S.hist.error, false, true);
    return reqId === S.groupReqId && traceHistoryReady();
  }

  function currentTraceIndex(stages) {
    if (!stages.length) return -1;
    if (S.replaySeq === null) return stages.length - 1;
    const exact = stages.findIndex(event => Number(event.seq) === Number(S.replaySeq));
    if (exact !== -1) return exact;
    let best = 0;
    for (let i = 0; i < stages.length; i++) {
      if (Number(stages[i].seq) <= Number(S.replaySeq)) best = i;
      else break;
    }
    return best;
  }

  function traceIconSvg(kind) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('fill', 'none');
    const add = (tag, attrs) => {
      const node = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      svg.appendChild(node);
    };
    if (kind === 'first') {
      add('path', { d: 'M4 3.2v9.6', stroke: 'currentColor', 'stroke-width': '1.7', 'stroke-linecap': 'round' });
      add('path', { d: 'M12.2 3.5L6.5 8l5.7 4.5V3.5z', fill: 'currentColor' });
    } else if (kind === 'prev') {
      add('path', { d: 'M10.2 3.2L5.4 8l4.8 4.8', stroke: 'currentColor', 'stroke-width': '1.75', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    } else if (kind === 'next') {
      add('path', { d: 'M5.8 3.2L10.6 8l-4.8 4.8', stroke: 'currentColor', 'stroke-width': '1.75', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    } else if (kind === 'pause') {
      add('rect', { x: '4', y: '3.2', width: '2.8', height: '9.6', rx: '0.8', fill: 'currentColor' });
      add('rect', { x: '9.2', y: '3.2', width: '2.8', height: '9.6', rx: '0.8', fill: 'currentColor' });
    } else {
      add('path', { d: 'M5 3.3l7.4 4.7L5 12.7V3.3z', fill: 'currentColor' });
    }
    return svg;
  }

  function eventTimeMs(ev) {
    if (!ev) return NaN;
    const raw = ev.sentAt ?? ev.receiptAt ?? ev.readAt ?? ev.at;
    if (raw === undefined || raw === null || raw === '') return NaN;
    const d = typeof raw === 'number' ? raw : Date.parse(String(raw));
    return Number.isFinite(d) ? d : NaN;
  }

  function fmtElapsed(deltaMs) {
    if (!Number.isFinite(deltaMs) || deltaMs < 0) return '';
    const totalSec = Math.floor(deltaMs / 1000);
    if (totalSec < 60) return '+' + totalSec + 's';
    const totalMin = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    if (totalMin < 60) return '+' + totalMin + 'm' + (sec ? ' ' + pad2(sec) + 's' : '');
    const hrs = Math.floor(totalMin / 60);
    const mins = totalMin % 60;
    return '+' + hrs + 'h ' + pad2(mins) + 'm';
  }

  function findMessageContext(events, messageId, maxSeq) {
    if (!messageId) return null;
    for (let i = (events || []).length - 1; i >= 0; i--) {
      const ev = events[i];
      if (!ev || Number(ev.seq) > Number(maxSeq)) continue;
      if (realMessageId(ev) !== String(messageId)) continue;
      if (ev.type === 'message_sent' || ev.type === 'message_reply') {
        const text = (typeof ev.text === 'string' && ev.text.trim()) || (typeof ev.summary === 'string' && ev.summary.trim()) || '';
        return {
          from: ev.from || ev.fromActorId || '',
          to: ev.to || ev.toActorId || '',
          text
        };
      }
    }
    return null;
  }

  function updateTraceSliderVisual(slider, idx, total) {
    if (!slider) return;
    const pct = total <= 1 ? (total === 1 ? 100 : 0) : Math.max(0, Math.min(100, (idx / (total - 1)) * 100));
    slider.style.setProperty('--trace-pct', pct.toFixed(2) + '%');
  }

  function renderTraceCounterInto(counterEl, stages, idx) {
    if (!counterEl) return;
    counterEl.textContent = '';
    if (!stages.length) {
      counterEl.textContent = S.hist.loading ? '正在读取事件…' : '0 / 0 · 暂无可回放事件';
      return;
    }
    const safeIdx = Math.max(0, Math.min(stages.length - 1, idx));
    const ev = stages[safeIdx];
    const startMs = eventTimeMs(stages[0]);
    const curMs = eventTimeMs(ev);
    const elapsed = Number.isFinite(startMs) && Number.isFinite(curMs) && curMs >= startMs ? fmtElapsed(curMs - startMs) : '';
    const timeText = ev && (ev.sentAt || ev.receiptAt || ev.readAt || ev.at)
      ? fmtDateTime(ev.sentAt ?? ev.receiptAt ?? ev.readAt ?? ev.at)
      : '';
    counterEl.appendChild(el('strong', { text: String(safeIdx + 1) }));
    counterEl.appendChild(el('span', { text: '/ ' + stages.length }));
    counterEl.appendChild(el('span', { className: 'mono', text: '· #' + ev.seq }));
    if (timeText) counterEl.appendChild(el('span', { className: 'mono', text: '· ' + timeText }));
    if (elapsed) counterEl.appendChild(el('span', { className: 'dim mono', text: '(' + elapsed + ')' }));
  }

  function renderTraceCardInto(cardEl, visual, nodes, events, hasStages) {
    if (!cardEl) return;
    cardEl.textContent = '';
    if (visual) {
      cardEl.setAttribute('data-seq', String(visual.seq));
      cardEl.setAttribute('data-phase', String(visual.kind));
      const badge = stageBadgeMeta(visual.type);
      const lead = el('div', { className: 'trace-card-lead' },
        el('span', { className: 'mono dim', text: '#' + visual.seq }),
        el('span', { className: 'trace-chip ' + badge.cls, text: badge.text }),
        el('span', { className: 'trace-card-route', text: traceEventLabel(visual, nodes) })
      );
      const timeLabel = el('span', {
        className: 'trace-card-time mono',
        text: visual.timeCap.label + ' ' + visual.timeCap.value
      });
      cardEl.appendChild(el('div', { className: 'trace-card-head' }, lead, timeLabel));

      let snippet = '';
      if (visual.kind === 'send_source' || visual.kind === 'reply_source') {
        snippet = shortText(visual.summary, 200);
      } else if (visual.messageId) {
        const ctx = findMessageContext(events, visual.messageId, visual.seq);
        if (ctx && ctx.text) {
          const prefix = visual.kind === 'read_pulse' && ctx.from && ctx.to ? (ctx.from + ' → ' + ctx.to + '：') : '';
          snippet = prefix + shortText(ctx.text, 160);
        }
      }
      if (snippet) {
        cardEl.appendChild(el('p', { className: 'trace-card-body', text: snippet }));
      }
      return;
    }
    cardEl.removeAttribute('data-seq');
    cardEl.removeAttribute('data-phase');
    const emptyText = S.replayError
      ? '回放已停止'
      : (S.hist.loading && !hasStages)
        ? '正在读取事件记录…'
        : '本批次暂无可回放的信件事件';
    cardEl.appendChild(el('p', { className: 'trace-card-empty', text: emptyText }));
  }

  function previewTraceStepInPlace(stages, idx, nodes) {
    const safeIdx = Math.max(0, Math.min(stages.length - 1, idx));
    const ev = stages[safeIdx];
    const counterEl = document.getElementById('deskTraceCounter');
    renderTraceCounterInto(counterEl, stages, safeIdx);
    const cardEl = document.getElementById('deskTraceEvent');
    const visual = ev ? buildTraceVisual({ atEvent: ev, events: S.hist.events }) : null;
    renderTraceCardInto(cardEl, visual, nodes, S.hist.events, stages.length > 0);
  }

  async function seekDeskTraceIndex(targetIndex) {
    if (!S.group || S.needsRun || (S.hist.loading && !traceHistoryReady()) || TRACE.filling) return;
    pauseDeskTrace();
    const generation = TRACE.generation;
    const reqId = S.groupReqId;
    const valid = () => generation === TRACE.generation && reqId === S.groupReqId && S.tab === 'graph';
    if (!traceHistoryReady()) {
      TRACE.filling = true;
      render();
      const ready = await prepareDeskTrace(reqId);
      if (!valid()) return;
      TRACE.filling = false;
      if (!ready) { render(); return; }
    }
    const events = S.hist.events.slice();
    const stages = historyTraceSteps(events);
    if (!stages.length) { render(); return; }
    const clamped = Math.max(0, Math.min(stages.length - 1, Math.trunc(targetIndex)));
    if (clamped === stages.length - 1) {
      await returnToLive();
      return;
    }
    await enterReplay(stages[clamped].seq, events, generation);
  }

  async function moveDeskTrace(action) {
    if (TRACE.playing && action === 'play') {
      pauseDeskTrace();
      render();
      return;
    }
    if (!S.group || S.needsRun || (S.hist.loading && !traceHistoryReady()) || TRACE.filling) return;
    pauseDeskTrace();
    const generation = TRACE.generation;
    const reqId = S.groupReqId;
    const valid = () => generation === TRACE.generation && reqId === S.groupReqId && S.tab === 'graph';
    if (!traceHistoryReady()) {
      TRACE.filling = true;
      render();
      const ready = await prepareDeskTrace(reqId);
      if (!valid()) return;
      TRACE.filling = false;
      if (!ready) { render(); return; }
    }
    const events = S.hist.events.slice();
    const stages = historyTraceSteps(events);
    if (!stages.length) { render(); return; }
    const idx = currentTraceIndex(stages);
    if (action === 'first') {
      if (stages.length === 1) await enterReplay(stages[0].seq, events, generation);
      else await seekDeskTraceIndex(0);
      return;
    }
    if (action === -1) {
      if (idx > 0) await seekDeskTraceIndex(idx - 1);
      else render();
      return;
    }
    if (action === 1) {
      if (idx >= 0 && idx < stages.length - 1) await seekDeskTraceIndex(idx + 1);
      else render();
      return;
    }
    let index = (S.replaySeq === null || idx < 0 || idx >= stages.length - 1) ? 0 : idx + 1;
    TRACE.playing = true;
    const step = async () => {
      if (!valid()) return;
      const ok = await enterReplay(stages[index].seq, events, generation);
      if (!valid()) return;
      if (!ok || ++index === stages.length) {
        TRACE.playing = false;
        render();
        return;
      }
      TRACE.timer = setTimeout(step, 1200);
    };
    await step();
  }

  function traceEventLabel(visual, nodes) {
    if (visual.kind === 'read_pulse') return (visual.recipient || '收件方未记') + ' 取信';
    if (visual.kind === 'other') return visual.summary;
    const route = (visual.from || '发件方未记') + ' → ' + (visual.to || '收件方未记');
    if (visual.kind === 'send_source' || visual.kind === 'reply_source') return route + ' · 此步只记发出';
    if (visual.kind === 'delivery_text_only') return route + ' · 投递状态待确认';
    const listed = findCanvasNode(nodes, visual.from, visual.fromActorId) && findCanvasNode(nodes, visual.to, visual.toActorId);
    return route + (listed ? ' · 回执确认送达' : ' · 回执确认送达，图中缺少端点');
  }

  function renderGraphTraceSection(ds, connected) {
    const events = S.hist.events;
    const stages = historyTraceSteps(events);
    const seq = S.replaySeq;
    const total = stages.length;
    const idx = currentTraceIndex(stages);
    const isAtLatest = seq === null;
    const loaded = traceHistoryReady();
    const historyBlocked = (S.hist.loading && !loaded) || TRACE.filling;
    const nothing = total === 0;

    let activeVisual = null;
    let activeEvents = events;
    if (seq !== null) {
      const snapshot = S.replay?.seq === seq ? S.replay : null;
      if (snapshot) {
        activeVisual = buildTraceVisual(snapshot);
        activeEvents = snapshot.events || events;
      } else {
        const pendingEv = events.find(ev => Number(ev.seq) === Number(seq)) || (idx >= 0 ? stages[idx] : null);
        if (pendingEv) activeVisual = buildTraceVisual({ atEvent: pendingEv, events });
      }
    } else if (total > 0) {
      activeVisual = buildTraceVisual({ atEvent: stages[total - 1], events });
    }

    const firstDisabled = historyBlocked || nothing || (idx <= 0 && !isAtLatest) || (total <= 1);
    const prevDisabled = historyBlocked || nothing || idx <= 0;
    const nextDisabled = historyBlocked || nothing || idx < 0 || idx >= total - 1;
    const playLabel = TRACE.playing ? '暂停' : TRACE.filling ? '正在读取…' : '播放轨迹';

    const sliderVal = total > 0 ? Math.max(1, idx + 1) : 0;
    const slider = el('input', {
      type: 'range',
      id: 'deskTraceSlider',
      className: 'trace-slider',
      min: total > 0 ? 1 : 0,
      max: total,
      step: 1,
      value: sliderVal,
      disabled: historyBlocked || nothing,
      'aria-label': '事件回放进度',
      'aria-valuemin': total > 0 ? 1 : 0,
      'aria-valuemax': total,
      'aria-valuenow': sliderVal,
      'aria-valuetext': total > 0 && activeVisual
        ? ('第 ' + sliderVal + ' / ' + total + ' 条 · #' + activeVisual.seq + ' · ' + eventTypeLabel(activeVisual.type))
        : '暂无可回放事件',
      onPointerDown: () => {
        if (TRACE.playing) pauseDeskTrace();
        TRACE.scrubbing = true;
        TRACE.pendingIndex = null;
      },
      onInput: (e) => {
        if (!stages.length) return;
        const nextIdx = Math.max(0, Math.min(stages.length - 1, Number(e.target.value) - 1));
        updateTraceSliderVisual(e.target, nextIdx, stages.length);
        e.target.setAttribute('aria-valuenow', String(nextIdx + 1));
        if (TRACE.scrubbing) {
          TRACE.pendingIndex = nextIdx;
          previewTraceStepInPlace(stages, nextIdx, ds.nodes);
        } else {
          void seekDeskTraceIndex(nextIdx);
        }
      },
      onChange: (e) => {
        if (!stages.length || TRACE.scrubbing) return;
        const nextIdx = Math.max(0, Math.min(stages.length - 1, Number(e.target.value) - 1));
        const alreadyAtTarget =
          (nextIdx === stages.length - 1 && S.replaySeq === null) ||
          (stages[nextIdx] && Number(S.replaySeq) === Number(stages[nextIdx].seq));
        if (!alreadyAtTarget) void seekDeskTraceIndex(nextIdx);
      },
      onKeyDown: (e) => {
        if (!stages.length) return;
        if (e.key === 'End') {
          e.preventDefault();
          void seekDeskTraceIndex(stages.length - 1);
        } else if (e.key === 'Home') {
          e.preventDefault();
          void seekDeskTraceIndex(0);
        }
      }
    });
    slider.value = String(sliderVal);
    updateTraceSliderVisual(slider, Math.max(0, idx), total);

    const liveBtnText = connected ? '实时' : '最新';
    const liveBtnAria = connected ? '回到实时' : '回到最新记录';
    const liveBtn = el('button', {
      type: 'button',
      id: 'deskTraceLatest',
      className: 'trace-live-btn' + (isAtLatest ? (' is-active ' + (connected ? 'is-live' : 'is-hist')) : ''),
      disabled: isAtLatest,
      'aria-label': liveBtnAria,
      title: liveBtnAria + ' (End)',
      onClick: () => returnToLive()
    }, el('span', { className: 'trace-live-dot', 'aria-hidden': 'true' }), el('span', { text: liveBtnText }));

    const controlsRow = el('div', { className: 'trace-controls-row' },
      el('div', { className: 'trace-btn-group' },
        el('button', {
          type: 'button',
          className: 'trace-icon-btn',
          id: 'deskTraceFirst',
          'aria-label': '回到第一条',
          title: '回到第一条 (Home)',
          disabled: firstDisabled,
          onClick: () => moveDeskTrace('first')
        }, traceIconSvg('first')),
        el('button', {
          type: 'button',
          className: 'trace-icon-btn',
          id: 'deskTracePrev',
          'aria-label': '上一条',
          title: '上一条',
          disabled: prevDisabled,
          onClick: () => moveDeskTrace(-1)
        }, traceIconSvg('prev')),
        el('button', {
          type: 'button',
          className: 'trace-icon-btn is-play' + (TRACE.playing ? ' is-playing' : ''),
          id: 'deskTracePlay',
          'aria-label': playLabel,
          'aria-pressed': String(TRACE.playing),
          title: playLabel,
          disabled: nothing || (!TRACE.playing && historyBlocked),
          onClick: () => moveDeskTrace('play')
        }, traceIconSvg(TRACE.playing ? 'pause' : 'play')),
        el('button', {
          type: 'button',
          className: 'trace-icon-btn',
          id: 'deskTraceNext',
          'aria-label': '下一条',
          title: '下一条',
          disabled: nextDisabled,
          onClick: () => moveDeskTrace(1)
        }, traceIconSvg('next'))
      ),
      el('div', { className: 'trace-slider-wrap' }, slider),
      liveBtn
    );

    const counterEl = el('div', { id: 'deskTraceCounter', className: 'trace-counter' });
    renderTraceCounterInto(counterEl, stages, Math.max(0, idx));

    const modeText = ds.isReplay
      ? ('回放 #' + seq)
      : connected
        ? '实时同步'
        : (folderState.mode === 'folder' ? '只读历史' : '最新记录');
    const metaRow = el('div', { className: 'trace-meta-row' },
      counterEl,
      el('div', { className: 'trace-meta-right' },
        el('span', { className: 'pill ' + (ds.useLive ? 'live' : 'replay'), text: modeText }),
        S.hist.hasMore ? el('button', {
          type: 'button',
          className: 'btn',
          disabled: historyBlocked,
          onClick: () => loadHistory(S.group, S.groupReqId, true, false, true)
        }, '加载完整历史') : null
      )
    );

    const player = el('section', { className: 'trace-player', 'aria-label': '时间轴与证据回放' }, controlsRow, metaRow);

    const eventCard = el('article', {
      id: 'deskTraceEvent',
      className: 'trace-event-card',
      role: 'status',
      'aria-live': 'polite',
      'aria-atomic': 'true'
    });
    renderTraceCardInto(eventCard, activeVisual, ds.nodes, activeEvents, total > 0);

    return el('div', { className: 'trace-panel' }, player, eventCard);
  }

  let repaintDeskGraph;
  function renderGraph() {
    repaintDeskGraph = undefined;
    const ds = getGraphDataset();

    const events = S.hist.events || [];

      stage.appendChild(listWrap);
    } else {

        ds.edges.length ? '归属虚线：组↔成员 · 实线箭头：真实消息方向（' + ds.edges.length + ' 条边）' : '暂无成员间消息方向边（仅显示组归属接线）'
      ));
      stage.appendChild(el('div', { className: 'stage-legend' },
        el('span', {}, '●工作'), el('span', {}, '◐待命'), el('span', {}, '✓本轮完成'), el('span', {}, '×退场')
      ));

      requestAnimationFrame(() => {
        if (!stage.isConnected) return;
        const rect = stage.getBoundingClientRect();
        const w = Math.max(320, rect.width);
        const h = Math.max(420, rect.height);
        if (w < 740 && S.graphWidth !== w) {
          S.graphWidth = w;

          return;
        }
        S.graphWidth = w;
        const cx = w / 2, cy = h / 2;
        const rad = Math.min(w * 0.34, h * 0.35, 215);
        ds.nodes.forEach((n, idx) => {

        repaintDeskGraph = () => {

        el('div', { className: 'kv' }, el('span', { className: 'kv-k' }, '回合 / 模型'), el('span', { className: 'kv-v', text: memberTurn(r) + ' · ' + memberModel(r) })),
        el('div', { className: 'kv' }, el('span', { className: 'kv-k' }, 'actorId / id'), el('span', { className: 'kv-v', text: (r.actorId || '—') + ' / ' + (r.id || '—') }))
      ));

      }

    } else {

      ));

      const desc = el('div', { className: 'empty-desc', text: detail });
      desc.style.fontSize = '13px';
      desc.style.color = 'var(--muted)';

      const panel = el('div', { className: 'panel empty' }, heading, desc);
      panel.style.padding = '28px 20px';
      panel.style.textAlign = 'center';
      return panel;
    };

    if (!group) {
      if (S.loading) {
        return buildPanel('正在加载协作组…', folderState.mode === 'folder'
          ? '正在从选定历史目录读取协作组列表，请稍候。'
          : '正在从当前会话服务读取协作组列表，请稍候。');
      }
      if (S.error) {
        return null;
      }

      const seen = new Set([...S.groups, ...S.historyGroups]);

      if (seen.size === 0) {
        return buildPanel(
          folderState.mode === 'folder' ? '该目录暂无协作组记录' : '暂无协作组',
          folderState.mode === 'folder'
            ? '当前选择的只读历史目录中未找到协作组记录，可重新选择目录或返回当前会话。'
            : '当前项目尚未记录任何实时或历史协作组。'
        );
      }

      const detail = seen.size > 1
        ? (folderState.mode === 'folder'
          ? `当前只读历史目录共有 ${seen.size} 个协作组，请在上方工具栏选择要查看的协作组。`
          : `当前共有 ${seen.size} 个协作组，请在上方工具栏选择要查看的协作组。`)
        : '请在上方工具栏选择要查看的协作组。';
      return buildPanel('先选择协作组', detail);
    }

    if (S.error && !S.loading) {
      return null;
    }

    const runIds = new Set(S.runs.map(run => run.runId));

    const runDetail = runIds.size > 1
      ? `协作组「${group}」共有 ${runIds.size} 个执行批次，请在上方工具栏选择要查看的执行批次。`
      : `请在上方工具栏为协作组「${group}」选择要查看的执行批次。`;
    return buildPanel('先选择执行批次', runDetail);
  }

  function render() {
    renderTopMeta();
    // Keep the native range input mounted while it owns an active pointer drag.
    if (S.tab === 'graph' && TRACE.scrubbing) return;
    if (S.tab === 'board' && S.group && !S.needsRun) {
      renderBoard();
      return;
    }
    const traceFocus = S.tab === 'graph' && $main.contains(document.activeElement) && document.activeElement.id.startsWith('deskTrace')
      ? document.activeElement.id : '';
    const currentMembers = S.tab === 'members' ? $main.querySelector('.members-layout') : null;
    const memberFocus = currentMembers?.contains(document.activeElement) ? document.activeElement.dataset.memberFocus : null;
    const memberRecord = currentMembers?.querySelector('.dm-record-panel');
    const memberScroll = memberRecord?.scrollTop || 0;
    const memberScope = currentMembers?.dataset.memberScope;
    $main.textContent = '';
    for (const b of renderBanners()) $main.appendChild(b);

    if (!S.group || S.needsRun) {
      const prompt = renderScopePrompt();
      if (prompt) $main.appendChild(prompt);
      return;
    }

    let nodes = [];
    if (S.tab === 'overview') nodes = renderOverview();
    else if (S.tab === 'members') nodes = renderMembers();
    else if (S.tab === 'graph') nodes = renderGraph();

    for (const n of nodes) if (n) $main.appendChild(n);
    if (traceFocus) {
      const focused = document.getElementById(traceFocus);
      (focused && !focused.disabled ? focused : document.getElementById('deskTracePlay'))?.focus({ preventScroll: true });
    }
    if (S.tab === 'members') {
      const layout = nodes[0];
      layout.dataset.memberScope = JSON.stringify([deskScope(), S.replaySeq, S.selectedMemberKey]);
      if (memberScope === layout.dataset.memberScope) {
        const record = layout.querySelector('.dm-record-panel');
        if (record) record.scrollTop = memberScroll;
      }
      if (memberFocus && currentMembers &&
          JSON.parse(memberScope || '[]')[0] === deskScope()) {
        Array.from(layout.querySelectorAll('[data-member-focus]'))
          .find(node => node.dataset.memberFocus === memberFocus)?.focus({ preventScroll: true });
      }
    }
  }

  $group.addEventListener('change', (e) => {
    if (e.target.value && e.target.value !== S.group) selectGroup(e.target.value);
  });

  $run.addEventListener('change', () => {
    if (S.runs.some(run => run.runId === $run.value)) selectGroup(S.group, $run.value);
  });

  if ($chooseFolderBtn) {
    $chooseFolderBtn.addEventListener('click', () => {
      void runFolderAction('select');
    });
  }

  if ($returnSessionBtn) {
    $returnSessionBtn.addEventListener('click', () => {
      void runFolderAction('return');
    });
  }

  for (const t of $tabs) {
    t.addEventListener('click', () => {
      if (S.tab === t.dataset.tab) return;
      if (S.tab === 'graph') pauseDeskTrace();
      S.tab = t.dataset.tab;
      syncTabs();
      if (S.tab === 'overview' && S.replaySeq !== null) {
        returnToLive();
        ensureCompleteHistory();
        return;
      }
      if (S.tab === 'overview' || S.tab === 'graph') ensureCompleteHistory();
      render();
    });
  }

  membersStacked.addEventListener('change', () => {
    if (S.tab === 'members') render();
  });
  let resizeTick = null;
  window.addEventListener('resize', () => {
    if (S.tab !== 'graph') return;
    if (resizeTick) clearTimeout(resizeTick);
    resizeTick = setTimeout(() => {
      const stage = document.getElementById('graphStage');
      if (stage) {
        S.graphWidth = stage.getBoundingClientRect().width;
        render();
      }
    }, 100);
  });

  if (typeof mountViaDeskTheme === 'function') {
    mountViaDeskTheme(document.getElementById('deskModeControls'), () => repaintDeskGraph?.());
  }
  initLoad();
  void loadHistoryProjects();
})();
</script>
</body>
</html>
