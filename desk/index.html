    } else if (folderState.error) {
      $folderStatus.hidden = false;
      $folderStatus.className = 'folder-status is-err';
      $folderStatus.setAttribute('role', 'alert');
      $folderStatus.textContent = '';
      $folderStatus.appendChild(el('span', { text: folderState.error }));
      $folderStatus.appendChild(el('button', {
        type: 'button',
        className: 'folder-status-close',
        'aria-label': '关闭目录错误提示',
        onClick: () => { folderState.error = ''; renderFolderBar(); }
      }, '×'));
    } else if (folderState.notice) {
      $folderStatus.hidden = false;
      $folderStatus.className = 'folder-status is-info';
      $folderStatus.setAttribute('role', 'status');
      $folderStatus.textContent = '';
      $folderStatus.appendChild(el('span', { text: folderState.notice }));
      $folderStatus.appendChild(el('button', {
        type: 'button',
        className: 'folder-status-close',
        'aria-label': '关闭目录提示',
        onClick: () => { folderState.notice = ''; renderFolderBar(); }
      }, '×'));
    } else {
      $folderStatus.hidden = true;
      $folderStatus.textContent = '';
    }
  }

  async function syncIdentityFallback(signal) {
    if (folderState.identityChecked) return;
    folderState.identityChecked = true;
    try {
      const data = await fetchJson('/api/identity', signal);
      if (applyFolderMeta(data)) {
        renderFolderBar();
        renderTopMeta();
      }
    } catch (_) {
      // Optional identity endpoint when /api/board does not include folder metadata
    }
  }

  async function fetchJson(url, signal) {
    const target = new URL(url, location.origin);
    if (target.origin !== location.origin || !SCOPED_API.has(target.pathname)) throw new Error('该请求不属于通信桌');
    if (!deskToken) throw new Error('请从 Claude 或本机启动器重新打开通信桌');
    const timeout = AbortSignal.timeout(10_000);
    const res = await fetch(target, {
      method: 'GET',
      headers: { Accept: 'application/json', 'X-Via-Desk': deskToken },
      signal: signal ? AbortSignal.any([signal, timeout]) : timeout,
      redirect: 'error',
      cache: 'no-store'
    });
    if (res.status === 401 || res.status === 403) throw new Error('本机入口已失效，请重新打开通信桌');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function abortKey(k) {
    if (S.aborts[k]) {
      try { S.aborts[k].abort(); } catch (_) {}
      S.aborts[k] = null;
    }
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function fmtTime(v) {
    if (v === undefined || v === null || v === '') return '—';
    const d = typeof v === 'number' ? new Date(v) : new Date(String(v));
    if (Number.isNaN(d.getTime())) return String(v);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function fmtDateTime(v) {
    if (v === undefined || v === null || v === '') return '—';
    const d = typeof v === 'number' ? new Date(v) : new Date(String(v));
    if (Number.isNaN(d.getTime())) return String(v);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + fmtTime(d);
  }

  function shortText(str, max) {
    if (!str) return '';
    const s = String(str).replace(/\s+/g, ' ').trim();
    return s.length > max ? s.slice(0, max) + '…' : s;
  }

  function monogram(name) {
    const s = String(name || '?').trim();
    if (!s) return '?';
    const parts = s.split(/[\s\-_./]+/).filter(Boolean);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return s.slice(0, 2).toUpperCase();
  }

  function classifyState(item, isPast) {
    const ps = item && item.processState ? String(item.processState).toLowerCase() : '';
    const st = item && item.state ? String(item.state).toLowerCase() : '';
    const pre = isPast ? '当时' : '';
    if (ps === 'exited') {
      return { kind: 'exited', cls: 'st-exited', glyph: '×', label: pre + '已退场', inPost: false };
    }
    if (st === 'waiting_inbox') {
      return { kind: 'waiting', cls: 'st-waiting', glyph: '◐', label: pre ? '当时待命' : '在岗 · 待命', short: pre + '待命', inPost: !isPast };
    }
    if (st === 'running' || st === 'starting' || st === 'peer_action') {
      const sub = st === 'starting' ? '启动中' : st === 'peer_action' ? '协作中' : '工作中';
      return { kind: 'working', cls: 'st-working', glyph: '●', label: pre ? pre + sub : '在岗 · ' + sub, short: pre + sub, inPost: !isPast };
    }
    if (st === 'completed') {
      return { kind: 'completed', cls: 'st-completed', glyph: '✓', label: pre + '本轮完成', short: pre + '本轮完成', inPost: false };
    }
    if (st && ['failed', 'error', 'crashed', 'aborted', 'cancelled', 'canceled', 'timeout', 'timed_out'].includes(st)) {
      return { kind: 'failed', cls: 'st-failed', glyph: '!', label: pre + '异常(' + item.state + ')', short: pre + '异常', inPost: false };
    }
    if (st) {
      return { kind: 'unknown', cls: 'st-unknown', glyph: '?', label: pre + '未知(' + item.state + ')', short: pre + '未知', inPost: false };
    }
    return { kind: 'unknown', cls: 'st-unknown', glyph: '?', label: pre + '状态未知', short: pre + '未知', inPost: false };
  }

  function badgeEl(st, extraText) {
    return el('span', { className: 'badge ' + st.cls }, st.glyph + ' ' + (extraText || st.label));
  }

  function memberKey(m) {
    return String(m.actorId || m.id || m.worker || 'unknown');
  }

  function memberName(m) {
    return String(m.id || m.worker || m.actorId || '未命名成员');
  }

  function memberModel(m) {
    const eff = m && m.selection && m.selection.effective ? m.selection.effective : null;
    const model = (eff && eff.model) || m.model || '';
    const effort = (eff && eff.effort) || m.effort || '';
    if (model && effort) return model + ' / ' + effort;
    return model || effort || '—';
  }

  function memberTurn(m) {
    if (m.turn !== undefined && m.turn !== null && m.turn !== '') return String(m.turn);
    if (m.turnId !== undefined && m.turnId !== null && m.turnId !== '') return String(m.turnId);
    return '—';
  }

  function memberRoleBadge(m) {
    if (!m) return null;
    if (m.supervisor || m.role === 'supervisor') return el('span', { className: 'badge st-waiting' }, '监管代理');
    if (m.role === 'coordinator' || m.depth === 0) return el('span', { className: 'badge st-hist' }, '协调者');
    if (m.depth === 2 || m.role === 'leaf') return el('span', { className: 'badge st-hist' }, '叶代理 ← ' + (m.parentId || '?'));
    return null;
  }

  function memberRoleText(m) {
    if (!m) return '—';
    if (m.supervisor || m.role === 'supervisor') return '监管代理 (supervisor · depth ' + (m.depth ?? 1) + ')';
    if (m.role === 'coordinator' || m.depth === 0) return '协调者 (coordinator · depth 0)';
    if (m.depth === 2 || m.role === 'leaf') return '叶代理 (leaf · depth 2' + (m.parentId ? ' · 父代理 ' + m.parentId : '') + ')';
    return '子代理 (' + (m.role || 'worker') + ' · depth ' + (m.depth ?? 1) + ')';
  }

  const deskAvatarFiles = new Set();

  function safeDeskAvatar(url) {
    return deskAvatarFiles.has(url) ? url : '';
  }

  function attachMessageAvatars(messages, members) {
    const avatars = new Map((members || []).filter(member => member.actorId)
      .map(member => [member.actorId, safeDeskAvatar(member.avatarUrl)]));
    return messages.map(message => ({ ...message,
      fromAvatarUrl: safeDeskAvatar(message.fromAvatarUrl) || avatars.get(message.fromActorId) || '',
      toAvatarUrl: safeDeskAvatar(message.toAvatarUrl) || avatars.get(message.toActorId) || ''
    }));
  }

  function deskPortrait(url, name, hex = false) {
    const safe = safeDeskAvatar(url);
    return safe ? el('img', { className: hex ? 'via-hex-portrait' : 'via-aux-portrait', src: safe, alt: '', decoding: 'async' })
      : hex ? monogram(name) : null;
  }

  function normalizeLiveMessages(peerEvents, group) {
    const list = Array.isArray(peerEvents) ? peerEvents : [];
    const out = [];
    const deliveries = new Map(S.hist.events.filter(event => event.type === 'message_delivery' &&
      event.runId === S.controllerId && event.messageId).map(event => [String(event.messageId), event]));
    for (let i = 0; i < list.length; i++) {
      const m = list[i];
      if (!m || !(m.id || m.messageId)) continue;
      if (m.group && group && m.group !== group) continue;
      const id = String(m.id || m.messageId);
      const receipt = deliveries.get(id);
      const d = m.delivery ? String(m.delivery).toLowerCase() : '';
      out.push({
        id,
        from: m.from || m.fromActorId || '未知发件方',
        to: m.to || m.toActorId || '未知收件方',
        fromActorId: m.fromActorId || '',
        toActorId: m.toActorId || '',
        fromAvatarUrl: safeDeskAvatar(m.fromAvatarUrl),
        toAvatarUrl: safeDeskAvatar(m.toAvatarUrl),
        text: typeof m.text === 'string' ? m.text : '',
        summary: m.summary,
        taskId: m.taskId,
        taskState: m.taskState,
        sentAt: m.sentAt ?? null,
        readAt: m.readAt ?? null,
        receiptAt: m.receiptAt ?? receipt?.receiptAt ?? null,
        replyTo: m.replyTo ? String(m.replyTo) : '',
        delivery: m.delivery || '',
        confirmedDelivered: Boolean(receipt) || d === 'delivered' || m.providerPhase === 'delivered',
        providerPhase: m.providerPhase || '',
        source: 'live'
      });
    }
    return out;
  }

  function aggregateHistoryMessages(events, maxSeq) {
    const map = new Map();
    const order = [];
    for (const ev of events || []) {
      if (!ev) continue;
      if (maxSeq !== null && maxSeq !== undefined && Number(ev.seq) > Number(maxSeq)) continue;
      if (!ev.messageId || !['message_sent', 'message_delivery', 'message_read', 'message_reply', 'message_task_state'].includes(ev.type)) continue;
      const mid = String(ev.messageId);
      let rec = map.get(mid);
      if (ev.type === 'message_task_state') {
        if (rec) {
          rec.taskId = ev.taskId;
          rec.taskState = ev.taskState;
        }
        continue;
      }
      if (!rec) {
        rec = {
          id: mid, from: '', to: '', fromActorId: '', toActorId: '', text: '',
          sentAt: null, readAt: null, receiptAt: null, replyTo: '',
          delivery: '', confirmedDelivered: false, providerPhase: '',
          seq: ev.seq, lastSeq: ev.seq, source: 'history'
        };
        map.set(mid, rec);
        order.push(rec);
      }
      rec.lastSeq = ev.seq;
      if (ev.from) rec.from = ev.from;
      if (ev.to) rec.to = ev.to;
      if (ev.fromActorId) rec.fromActorId = ev.fromActorId;
      if (ev.toActorId) rec.toActorId = ev.toActorId;
      if (ev.replyTo) rec.replyTo = String(ev.replyTo);
      if (ev.providerPhase) rec.providerPhase = ev.providerPhase;
      if (ev.type === 'message_sent' || ev.type === 'message_reply') {
        if (typeof ev.text === 'string') rec.text = ev.text;
        if (ev.summary) rec.summary = ev.summary;
        if (ev.taskId) rec.taskId = ev.taskId;
        if (ev.taskState) rec.taskState = ev.taskState;
        rec.sentAt = ev.sentAt ?? rec.sentAt;
        if (ev.delivery) {
          rec.delivery = ev.delivery;
          if (String(ev.delivery).toLowerCase() === 'delivered') rec.confirmedDelivered = true;
        }
      }
      if (ev.type === 'message_delivery') {
        const d = ev.delivery ? String(ev.delivery).toLowerCase() : 'delivered';
        rec.delivery = ev.delivery || 'delivered';
        if (d === 'delivered' || !ev.delivery) rec.confirmedDelivered = true;
        rec.receiptAt = ev.receiptAt ?? rec.receiptAt;
      }
      if (ev.type === 'message_read') {
        rec.readAt = ev.readAt ?? rec.readAt;
      }
    }
    for (const r of order) {
      if (!r.from) r.from = r.fromActorId || '未知发件方';
      if (!r.to) r.to = r.toActorId || '未知收件方';
    }
    return order;
  }

  function deliveryStatusText(m) {
    if (m.confirmedDelivered) {
      return '✓ 已确认投递' + (m.receiptAt ? ' (' + fmtTime(m.receiptAt) + ')' : '');
    }
    if (m.readAt) return '○ 未见独立投递回执';
    const d = String(m.delivery || '').toLowerCase();
    if (d === 'sent') return '○ 已发送（未确认投递）';
    if (d === 'queued') return '○ 排队中（未确认投递）';
    if (d) return '△ ' + m.delivery + (m.providerPhase ? ' / ' + m.providerPhase : '');
    if (m.providerPhase) return '○ 未确认投递（' + m.providerPhase + '）';
    return '○ 未见投递确认';
  }

  function eventTypeLabel(t) {
    const map = {
      member_registered: '成员注册',
      worker_state: '状态变更',
      message_sent: '发送消息',
      message_delivery: '确认投递',
      message_read: '收件取信',
      message_reply: '发送回信',
      message_task_state: '关联任务状态',
      worker_notification: '成员通知'
    };
    return map[t] || t || '事件';
  }

  function eventSummary(ev) {
    if (!ev) return '';
    const type = ev.type;
    if (type === 'message_sent' || type === 'message_reply') {
      return (ev.from || ev.fromActorId || '?') + ' → ' + (ev.to || ev.toActorId || '?') + (ev.text ? '：' + shortText(ev.text, 34) : '');
    }
    if (type === 'message_delivery') {
      return (ev.from || '?') + ' → ' + (ev.to || '?') + ' [' + (ev.delivery || 'delivered') + ']';
    }
    if (type === 'message_read') {
      return (ev.to || ev.actorId || '?') + ' 取信 ' + (ev.messageId || '');
    }
    if (type === 'message_task_state') {
      return classifyState({ state: ev.taskState }, true).label + ' · ' + shortText(ev.messageId, 12);
    }
    if (type === 'worker_state' || type === 'member_registered' || type === 'worker_notification') {
      const who = ev.worker || ev.id || ev.actorId || '?';
      const st = ev.processState === 'exited' ? '已退场' : (ev.state || '');
      return who + (st ? ' · ' + st : '') + (ev.source ? ' (' + ev.source + ')' : '');
    }
    return String(ev.actorId || '');
  }

  function buildUnifiedLiveMembers() {
    const liveTasks = Array.isArray(S.board.tasks) ? S.board.tasks : [];
    const histMembers = Array.isArray(S.hist.members) ? S.hist.members : [];
    const out = [];
    const seen = new Set();
    for (const t of liveTasks) {
      const key = memberKey(t);
      seen.add(key);
      out.push({ key, raw: t, live: true, st: classifyState(t, false) });
    }
    for (const hm of histMembers) {
      const key = memberKey(hm);
      if (seen.has(key)) continue;
      out.push({ key, raw: hm, live: false, st: classifyState(hm, true) });
    }
    return out;
  }

  function buildNodeLookup(nodes) {
    const byActor = new Map(), byId = new Map();
    for (const n of nodes) {
      const r = n.raw;
      if (r.actorId) byActor.set(String(r.actorId), n.key);
      if (r.id) byId.set(String(r.id), n.key);
    }
    return (actorId, name) => {
      if (actorId) return byActor.get(String(actorId)) ?? '';
      return byActor.get(String(name)) ?? byId.get(String(name)) ?? '';
    };
  }

  function buildEdges(nodes, messages) {
    const resolve = buildNodeLookup(nodes);
    const pairMap = new Map();
    const externalEdges = [];
    for (const m of messages) {
      const fk = resolve(m.fromActorId, m.from);
      const tk = resolve(m.toActorId, m.to);
      if (fk && tk && fk !== tk) {
        const ek = fk + '->' + tk;
        let e = pairMap.get(ek);
        if (!e) {
          e = { key: ek, fromKey: fk, toKey: tk, fromLabel: m.from, toLabel: m.to, count: 0, confirmed: 0, read: 0, latestAt: 0, messages: [] };
          pairMap.set(ek, e);
        }
        e.count++;
        if (m.confirmedDelivered) e.confirmed++;
        if (m.readAt) e.read++;
        const ts = Number(new Date(m.sentAt || m.receiptAt || m.readAt || 0)) || 0;
        if (ts >= e.latestAt) e.latestAt = ts;
        e.messages.push(m);
      } else if ((m.from || m.to) && m.from !== m.to) {
        externalEdges.push(m);
      }
    }
    return { edges: Array.from(pairMap.values()), externalEdges };
  }

  function stopPoll() {
    if (S.pollTimer) {
      clearTimeout(S.pollTimer);
      S.pollTimer = null;
    }
  }

  function groupIsLive() {
    return folderState.mode !== 'folder' && S.liveAvailable && S.groups.includes(S.group);
  }

  const SYNC = {
    initDone: false,
    initPending: false,
    inFlight: false,
    inFlightReqId: -1,
    inFlightKind: '',
    gen: 0,
    discoverAbort: null,
    bound: false,
  };

  function isAbortError(err) {
    return Boolean(err && (err.name === 'AbortError' || err.code === 20));
  }

  function sameGroupList(a, b) {
    return a.length === b.length && a.every((name, index) => name === b[index]);
  }

  function abortDiscoveryPoll() {
    const ctrl = SYNC.discoverAbort;
    SYNC.discoverAbort = null;
    if (SYNC.inFlight && SYNC.inFlightKind === 'discover') {
      SYNC.gen++;
      SYNC.inFlight = false;
      SYNC.inFlightKind = '';
    }
    if (ctrl) {
      if (S.aborts && S.aborts.board === ctrl) S.aborts.board = null;
      try { ctrl.abort(); } catch (_) {}
    }
  }

  function beginInitSync() {
    SYNC.initPending = true;
    stopPoll();
    abortDiscoveryPoll();
  }

  function endInitSync() {
    SYNC.initPending = false;
    SYNC.initDone = true;
  }

  function schedulePoll(delayMs = POLL_MS) {
    stopPoll();
    if (document.hidden) return;
    if (S.group) abortDiscoveryPoll();
    if (SYNC.inFlight && SYNC.inFlightReqId !== S.groupReqId) {
      SYNC.gen++;
      SYNC.inFlight = false;
      SYNC.inFlightKind = '';
    }
    if (S.replaySeq != null || folderState.mode === 'folder') return;
    const wait = Number.isFinite(delayMs) && delayMs >= 0 ? delayMs : POLL_MS;
    S.pollTimer = setTimeout(() => {
      S.pollTimer = null;
      void runPollTick();
    }, wait);
  }

  async function pollDiscovery(gen, startReqId) {
    const ctrl = new AbortController();
    SYNC.discoverAbort = ctrl;
    if (S.aborts) S.aborts.board = ctrl;
    try {
      const data = await fetchJson('/api/board', ctrl.signal);
      if (
        ctrl.signal.aborted ||
        gen !== SYNC.gen ||
        S.group ||
        S.groupReqId !== startReqId ||
        S.replaySeq != null ||
        SYNC.initPending ||
        S.loading
      ) {
        return { stale: true };
      }
      if (!data || typeof data !== 'object') {
        return { changed: false, selected: false };
      }
      if (applyFolderMeta(data)) renderFolderBar();

      const groups = Array.isArray(data.groups) ? data.groups.filter(name => typeof name === 'string' && name.trim()) : [];
      const historyGroups = Array.isArray(data.historyGroups) ? data.historyGroups.filter(name => typeof name === 'string' && name.trim()) : [];
      const changed = !sameGroupList(S.groups, groups) || !sameGroupList(S.historyGroups, historyGroups);
      if (!changed && !S.error) return { changed: false };
      S.groups = groups;
      S.historyGroups = historyGroups;
      S.error = '';
      const group = defaultDeskGroup(data, updateGroupSelect());
      if (group) {
        if (SYNC.discoverAbort === ctrl) SYNC.discoverAbort = null;
        if (S.aborts.board === ctrl) S.aborts.board = null;
        void selectGroup(group);
        return { selected: true };
      }
      render();
      return { changed: true };
    } catch (err) {
      if (ctrl.signal.aborted || isAbortError(err)) {
        return { stale: true };
      }
      throw err;
    } finally {
      if (SYNC.discoverAbort === ctrl) SYNC.discoverAbort = null;
      if (S.aborts && S.aborts.board === ctrl) S.aborts.board = null;
    }
  }

  async function pollSelectedGroup(group, reqId, gen) {
    await loadBoard(group, reqId, true);
    if (
      gen !== SYNC.gen ||
      S.group !== group ||
      S.groupReqId !== reqId ||
      S.replaySeq != null
    ) {
      return { stale: true };
    }
    if (!S.needsRun && S.hist.loaded && !S.hist.loading && !S.hist.hasMore) {
      await loadHistory(group, reqId, true, true);
    }
    return { stale: false };
  }

  async function runPollTick() {
    if (document.hidden) {
      stopPoll();
      return;
    }
    if (S.replaySeq != null) {
      stopPoll();
      return;
    }
    if (!SYNC.initDone || SYNC.initPending) return;
    if (SYNC.inFlight) return;
    if (S.loading) {
      schedulePoll();
      return;
    }

    stopPoll();
    if (!S.group) abortDiscoveryPoll();
    const gen = ++SYNC.gen;
    const startReqId = S.groupReqId;
    const startGroup = S.group;
    SYNC.inFlight = true;
    SYNC.inFlightReqId = startReqId;
    SYNC.inFlightKind = startGroup ? 'group' : 'discover';

    let outcome = null;
    try {
      outcome = startGroup
        ? await pollSelectedGroup(startGroup, startReqId, gen)
        : await pollDiscovery(gen, startReqId);
    } catch (_) {
      // A failed poll keeps the last confirmed group list and retries on the next interval.
    } finally {
      const isCurrent = SYNC.gen === gen;
      if (isCurrent) {
        SYNC.inFlight = false;
        SYNC.inFlightKind = '';
      }
      const superseded =
        !isCurrent ||
        S.groupReqId !== startReqId ||
        Boolean(outcome && (outcome.stale || outcome.selected));
      if (!superseded && S.replaySeq == null && !S.pollTimer) {
        schedulePoll();
      }
    }
  }

  function triggerImmediateSync() {
    if (document.hidden) return;
    if (S.replaySeq != null) return;
    if (!SYNC.initDone || SYNC.initPending) return;
    if (S.loading) return;
    if (SYNC.inFlight) return;
    stopPoll();
    void runPollTick();
  }

  function bindSyncLifecycle() {
    if (SYNC.bound) return;
    SYNC.bound = true;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopPoll();
      else triggerImmediateSync();
    });
    window.addEventListener('pageshow', (e) => {
      if (e && e.persisted) triggerImmediateSync();
    });
    window.addEventListener('pagehide', () => {
      pauseDeskTrace();
      stopPoll();
      abortDiscoveryPoll();
      abortKey('projects');
    });
    const finishScrub = () => {
      if (!TRACE.scrubbing) return;
      TRACE.scrubbing = false;
      const pending = TRACE.pendingIndex;
      TRACE.pendingIndex = null;
      if (S.tab !== 'graph') return;
      if (pending !== null) void seekDeskTraceIndex(pending);
      else render();
    };
    window.addEventListener('pointerup', finishScrub);
    window.addEventListener('pointercancel', finishScrub);
    window.addEventListener('blur', finishScrub);
  }

  bindSyncLifecycle();

  function defaultDeskGroup(data, names) {
    if (data.mode === 'session' && names.includes(data.defaultGroup)) return data.defaultGroup;
    return names.length === 1 ? names[0] : '';
  }

  function updateGroupSelect() {
    const seen = new Set();
    const names = [];
    const lists = folderState.mode === 'session' ? [S.historyGroups, S.groups] : [S.groups, S.historyGroups];
    for (const list of lists) {
      if (!Array.isArray(list)) continue;
      for (const item of list) {
        const raw = typeof item === 'string'
          ? item
          : (item && typeof item === 'object' ? (item.name || item.group || item.id || '') : '');
        const name = typeof raw === 'string' ? raw : '';
        if (!name.trim() || seen.has(name)) continue;
        seen.add(name);
        names.push(name);
      }
    }

    const current = S.group;
    const active = current && seen.has(current) ? current : '';
    const isEmpty = names.length === 0;
    const emptyLabel = S.loading ? '加载中…' : (S.error ? '加载失败' : '暂无协作组');
    const showPlaceholder = names.length > 1 && !active;
    const targetValue = isEmpty ? '' : (active || (names.length === 1 ? names[0] : ''));
    const key = JSON.stringify({
      empty: isEmpty ? emptyLabel : '',
      placeholder: showPlaceholder,
      names,
    });

    if (S.groupOptions !== key) {
      $group.textContent = '';
      $group.disabled = isEmpty;
      if (isEmpty) {
        $group.appendChild(el('option', {
          value: '',
          text: emptyLabel,
          disabled: true,
          selected: true,
        }));
      } else {
        if (showPlaceholder) {
          $group.appendChild(el('option', {
            value: '',
            text: '选择协作组',
            disabled: true,
            selected: true,
          }));
        }
        for (const name of names) {
          $group.appendChild(el('option', {
            value: name,
            text: name,
            title: name,
            selected: name === targetValue,
          }));
        }
      }
      $group.value = targetValue;
      S.groupOptions = key;
    } else {
      if ($group.disabled !== isEmpty) $group.disabled = isEmpty;
      if ($group.value !== targetValue) $group.value = targetValue;
    }

    return names;
  }

  async function initLoad() {
    beginInitSync();
    abortKey('init');
    const ac = new AbortController();
    S.aborts.init = ac;
    const reqId = (S.initReqId = (S.initReqId || 0) + 1);
    const prevGroup = S.group;
    const scopeAtStart = S.groupReqId;
    const prevRunId = S.runId;

    S.loading = true;
    S.error = '';
    updateGroupSelect();
    render();

    let data;
    try {
      data = await fetchJson('/api/board', ac.signal);
    } catch (err) {
      if (ac.signal.aborted || reqId !== S.initReqId || (err && err.name === 'AbortError')) {
        return;
      }
      S.loading = false;
      S.error = err && err.message ? String(err.message) : String(err || '加载失败');
      void syncIdentityFallback();
      updateGroupSelect();
      refreshRunChoices();
      render();
      if (!S.group) schedulePoll();
      return;
    } finally {
      if (S.aborts.init === ac) {
        S.aborts.init = null;
        endInitSync();
      }
    }

    if (ac.signal.aborted || reqId !== S.initReqId) {
      return;
    }
    if (!applyFolderMeta(data)) {
      void syncIdentityFallback();
    }
    renderFolderBar();
    renderTopMeta();

    const d = data && typeof data === 'object' ? data : {};
    const normList = items => Array.isArray(items)
      ? items.filter(item => typeof item === 'string' && item.trim()) : [];
    S.liveAvailable = Boolean(d.liveAvailable !== undefined ? d.liveAvailable : d.live);
    S.controllerId = typeof d.controllerId === 'string' ? d.controllerId : '';
    S.groups = normList(d.groups);
    S.historyGroups = normList(d.historyGroups);
    S.error = '';
    S.loading = false;

    const names = updateGroupSelect();
    if (scopeAtStart !== S.groupReqId) return;

    const group = names.includes(prevGroup) ? prevGroup : defaultDeskGroup(d, names);
    if (group) {
      await selectGroup(group, group === prevGroup ? prevRunId : '');
      return;
    }

    stopPoll();
    for (const key of ['board', 'hist', 'replay']) abortKey(key);
    S.replaySeq = null;
    S.replay = null;
    S.replayError = '';
    S.replayLoading = false;
    S.highlightMsgId = '';
    S.selectedMemberKey = '';
    S.graphSelectedKey = '';
    S.groupReqId = (S.groupReqId || 0) + 1;
    S.group = '';
    S.runId = '';
    S.runs = [];
    S.needsRun = false;
    S.board = { tasks: [], peerEvents: [] };
    if (S.hist && typeof S.hist === 'object') {
      if (Array.isArray(S.hist.events)) S.hist.events = [];
      if (Array.isArray(S.hist.messages)) S.hist.messages = [];
      if ('total' in S.hist) S.hist.total = 0;
      if ('loaded' in S.hist) S.hist.loaded = false;
      if ('runId' in S.hist) S.hist.runId = '';
    }
    updateGroupSelect();
    refreshRunChoices();
    render();
    schedulePoll();
  }

  async function selectGroup(groupName, runId = '') {
    pauseDeskTrace();
    stopPoll();
    abortKey('board');
    abortKey('hist');
    abortKey('replay');
    if (S.group !== groupName) S.runs = [];
    S.group = groupName;
    S.runId = runId;
    S.needsRun = !runId && S.runs.length > 1;
    refreshRunChoices();
    S.groupReqId++;
    const reqId = S.groupReqId;
    S.error = '';
    S.loading = true;
    S.lastBoardAt = 0;
    S.boardSource = S.groups.includes(groupName) ? 'live' : 'history';
    S.replaySeq = null;
    S.replay = null;
    S.replayError = '';
    S.replayLoading = false;
    S.selectedMemberKey = '';
    S.graphSelectedKey = '';
    S.highlightMsgId = '';
    S.board = { tasks: [], peerEvents: [] };
    S.hist = {
      loaded: false, loading: true, error: '',
      activeRunId: null, head: null, through: null, next: null, hasMore: false,
      recordingSince: null, anchorAt: null, events: [], members: []
    };
    updateGroupSelect();
    render();
    await loadBoard(groupName, reqId, false);
    if (S.groupReqId === reqId && !S.needsRun && !S.error) await loadHistory(groupName, reqId, false);
    else if (S.groupReqId === reqId) S.hist.loading = false;
    if (S.groupReqId === reqId && S.group === groupName) {
      S.loading = false;
      render();
      schedulePoll();
    }
  }

  async function loadBoard(groupName, reqId, isPoll) {
    if (isPoll && S.replaySeq !== null) return;
    abortKey('board');
    const ac = new AbortController();
    S.aborts.board = ac;
    try {
      const data = await fetchJson(apiUrl('/api/board', { group: groupName }), ac.signal);
      if (ac.signal.aborted || S.groupReqId !== reqId || S.group !== groupName) return;
      if (isPoll && S.replaySeq !== null) return;
      applyFolderMeta(data);
      S.controllerId = data.controllerId || '';
      S.liveAvailable = data.liveAvailable ?? Boolean(data.controllerId);
      if (Array.isArray(data.runs)) {
        const wasAmbiguous = S.needsRun;
        S.runs = data.runs.filter(run => typeof run?.runId === 'string');
        if (!S.runId && S.runs.some(run => run.runId === data.defaultRun)) S.runId = data.defaultRun;
        S.needsRun = S.runs.length > 1 && !S.runId;
        if ((!wasAmbiguous && S.needsRun) || (S.runId && !S.runs.some(run => run.runId === S.runId))) {
          S.runId = '';
          S.needsRun = S.runs.length > 1;
          abortKey('hist');
          S.hist = { loaded: false, loading: false, error: '', events: [], members: [] };
        }
        refreshRunChoices();
        if (S.runId || S.runs.length === 1) S.liveAvailable = data.runLive ?? S.liveAvailable;
      }
      if (Array.isArray(data.groups)) S.groups = data.groups;
      if (Array.isArray(data.historyGroups)) S.historyGroups = data.historyGroups;
      if (!S.lastBoardAt || S.boardSource === 'live' && !groupIsLive()) {
        S.boardSource = groupIsLive() ? 'live' : 'history';
      }
      updateGroupSelect();
      S.board = {
        tasks: Array.isArray(data.tasks) ? data.tasks : [],
        peerEvents: Array.isArray(data.peerEvents) ? data.peerEvents : []
      };
      S.lastBoardAt = Date.now();
      S.error = '';
      render();
      if (isPoll && !S.needsRun && !S.hist.loaded && !S.hist.loading) void loadHistory(groupName, reqId, false);
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (S.groupReqId !== reqId || S.group !== groupName) return;
      S.error = '实时看板更新失败：' + (err.message || String(err));
      render();
    }
  }

  function mergeEvents(existing, incoming) {
    const map = new Map();
    for (const e of existing) if (e && e.seq !== undefined) map.set(e.seq, e);
    for (const e of incoming) if (e && e.seq !== undefined) map.set(e.seq, e);
    return Array.from(map.values()).sort((a, b) => Number(a.seq) - Number(b.seq));
  }

  async function loadHistory(groupName, reqId, loadMore, refresh = false, complete = S.tab === 'overview' || S.tab === 'graph') {
    if (S.needsRun) return;
    const runId = S.runId || (S.runs.length === 1 ? S.runs[0].runId : null);
    abortKey('hist');
    const ac = new AbortController();
    S.aborts.hist = ac;
    S.hist.loading = true;
    S.hist.error = '';
    if (loadMore && !refresh) render();
    try {
      const params = { group: groupName, runId, after: loadMore && S.hist.next !== null ? S.hist.next : 0, limit: PAGE_LIMIT };
      if (loadMore && !refresh && S.hist.anchorAt !== null && S.hist.anchorAt !== undefined) {
        params.at = S.hist.anchorAt;
      }
      const data = await fetchJson(apiUrl('/api/history', params), ac.signal);
      if (ac.signal.aborted || S.groupReqId !== reqId || S.group !== groupName) return;
      const evs = Array.isArray(data.events) ? data.events : [];
      S.hist.loaded = true;
      S.hist.loading = false;
      S.hist.activeRunId = data.activeRunId ?? null;
      S.hist.head = data.head ?? null;
      S.hist.through = data.through ?? null;
      S.hist.next = data.next ?? null;
      S.hist.hasMore = Boolean(data.hasMore);
      S.hist.recordingSince = data.recordingSince ?? null;
      if (!loadMore || refresh) {
        S.hist.anchorAt = data.through ?? data.head ?? null;
        S.hist.events = mergeEvents(refresh ? S.hist.events : [], evs);
        S.hist.members = Array.isArray(data.members) ? data.members : [];
      } else {
        S.hist.events = mergeEvents(S.hist.events, evs);
        if (Array.isArray(data.members) && !S.hist.members.length) S.hist.members = data.members;
      }
      if (complete && S.hist.hasMore) {
        S.hist.loading = true;
        render();
        const at = S.hist.anchorAt;
        let after = S.hist.next;
        if (!Number.isSafeInteger(after) || !Number.isSafeInteger(at) || after >= at) {
          throw new Error('历史游标未推进');
        }
        const remaining = [];
        while (true) {
          const page = await fetchJson(apiUrl('/api/history', { group: groupName, runId, at, after, limit: PAGE_LIMIT }), ac.signal);
          if (ac.signal.aborted || S.groupReqId !== reqId || S.group !== groupName) return;
          if (page.group !== groupName || page.through !== at || !Number.isSafeInteger(page.next) ||
              page.next <= after || page.next > at || (!page.hasMore && page.next !== at) || !Array.isArray(page.events)) {
            throw new Error('历史游标未推进');
          }
          for (const event of page.events) remaining.push(event);
          after = page.next;
          if (!page.hasMore) break;
        }
        S.hist.events = mergeEvents(S.hist.events, remaining);
        S.hist.next = after;
        S.hist.hasMore = false;
        S.hist.loading = false;
      }
      render();
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (S.groupReqId !== reqId || S.group !== groupName) return;
      S.hist.loading = false;
      S.hist.error = '历史记录加载失败：' + (err.message || String(err));
      render();
    }
  }

  function ensureCompleteHistory() {
    if (S.group && !S.needsRun && S.hist.hasMore && !S.hist.loading && !S.hist.error) {
      void loadHistory(S.group, S.groupReqId, true, false, true);
    }
  }

  function ensureOverviewHistory() {
    ensureCompleteHistory();
  }

  async function enterReplay(seq, frozenEvents = null, guard = null) {
    const targetSeq = Number(seq);
    if (!Number.isSafeInteger(targetSeq) || targetSeq <= 0 || !S.group || S.needsRun) return false;
    if (!guard) pauseDeskTrace();
    stopPoll();
    abortKey('board');
    abortKey('replay');
    S.replaySeq = targetSeq;
    S.replayLoading = true;
    S.replayError = '';
    S.replayReqId++;
    const rId = S.replayReqId;
    const gId = S.groupReqId;
    const grp = S.group;
    render();
    const ac = new AbortController();
    S.aborts.replay = ac;
    try {
      let after = frozenEvents ? targetSeq : 0;
      let allEvents = frozenEvents ? frozenEvents.filter(event => event.seq <= targetSeq) : [];
      let snap = null;
      const runId = S.runId || (S.runs.length === 1 ? S.runs[0].runId : null);
      while (true) {
        const data = await fetchJson(apiUrl('/api/history', { group: grp, runId, at: targetSeq, after, limit: frozenEvents ? 1 : PAGE_LIMIT }), ac.signal);
        if (S.groupReqId !== gId || S.replayReqId !== rId || S.replaySeq !== targetSeq) return;
        if (data.group !== grp || data.through !== targetSeq || !Array.isArray(data.members)) throw new Error('历史锚点不一致');
        if (!snap) snap = data;
        const evs = Array.isArray(data.events) ? data.events : [];
        allEvents = mergeEvents(allEvents, evs);
        if (!data.hasMore) break;
        if (!Number.isSafeInteger(data.next) || data.next <= after) throw new Error('历史游标未推进');
        after = data.next;
      }
      const atEvent = allEvents.find((e) => Number(e.seq) === targetSeq) || null;
      S.replay = {
        seq: targetSeq,
        atEvent,
        through: snap && snap.through !== undefined ? snap.through : targetSeq,
        head: snap ? snap.head : S.hist.head,
        activeRunId: snap ? snap.activeRunId : null,
        recordingSince: snap ? snap.recordingSince : S.hist.recordingSince,
        members: snap && Array.isArray(snap.members) ? snap.members : [],
        events: allEvents
      };
      S.replayLoading = false;
      if (S.tab === 'graph' && (!guard || guard === TRACE.generation)) startTraceEffect(S.replay);
      render();
      return true;
    } catch (err) {
      if (err && err.name === 'AbortError') return false;
      if (S.groupReqId !== gId || S.replayReqId !== rId) return false;
      if (S.replay && S.replay.seq !== targetSeq) S.replay = null;
      S.replayLoading = false;
      S.replayError = '读取历史锚点 seq #' + targetSeq + ' 失败：' + (err.message || String(err));
      pauseDeskTrace();
      render();
      return false;
    }
  }

  async function returnToLive() {
    pauseDeskTrace();
    S.replayReqId++;
    abortKey('replay');
    S.replaySeq = null;
    S.replay = null;
    S.replayError = '';
    S.replayLoading = false;
    render();
    if (S.group) {
      if (folderState.mode === 'folder') {
        ensureCompleteHistory();
        return;
      }
      const { group, groupReqId } = S;
      await loadBoard(group, groupReqId, false);
      if (S.groupReqId !== groupReqId || S.replaySeq !== null) return;
      if (!S.needsRun && !S.error && !S.hist.loading) {
        const incremental = S.hist.loaded && !S.hist.hasMore && !S.hist.error;
        await loadHistory(group, groupReqId, incremental, incremental, true);
      }
      if (S.groupReqId === groupReqId) schedulePoll();
    }
  }

  function renderTopMeta() {
    $meta.textContent = '';
    renderFolderBar();
    if (S.replaySeq !== null) {
      $meta.appendChild(el('span', { className: 'pill replay' }, '◷ 历史回放 · seq #' + S.replaySeq));
    } else if (S.group) {
      const connected = groupIsLive() && !S.error;
      const label = connected ? '● 实时 · ' + (S.lastBoardAt ? fmtTime(S.lastBoardAt) : '同步中')
        : S.error && groupIsLive() ? '○ 实时连接中断'
        : folderState.mode === 'folder' ? '◷ 只读历史' : '◷ 历史组记录';
      $meta.appendChild(el('span', { className: 'pill ' + (connected ? 'live' : 'replay') }, label));
    }
    if (S.replaySeq === null && groupIsLive() && S.controllerId) {
      $meta.appendChild(el('span', { className: 'pill mono', title: 'Controller ID' }, 'ctl:' + shortText(S.controllerId, 16)));
    }
    if (S.loading) {
      $meta.appendChild(el('span', { className: 'pill' }, '加载中…'));
    }
  }

  function renderBanners() {
    const out = [];
    if (S.error) {
      out.push(el('div', { className: 'banner err', role: 'alert' },
        el('span', { text: S.error }),
        el('button', { className: 'btn', onClick: () => S.group ? loadBoard(S.group, S.groupReqId, false) : initLoad() }, '重试')
      ));
    }
    if (S.hist.error) {
      out.push(el('div', { className: 'banner warn', role: 'alert' },
        el('span', { text: S.hist.error }),
        el('button', { className: 'btn', onClick: () => S.group && loadHistory(S.group, S.groupReqId, false) }, '重载历史')
      ));
    }
    return out;
  }

  function openMemberRecord(key) {
    if (S.tab === 'graph') pauseDeskTrace();
    S.selectedMemberKey = key;
    S.tab = 'members';
    syncTabs();
    render();
  }

  function openBoardMessage(msgId, src) {
    if (S.tab === 'graph') pauseDeskTrace();
    if (src) S.boardSource = src;
    S.highlightMsgId = msgId;
    S.tab = 'board';
    syncTabs();
    render();
  }

  let messageBoardView;
  function renderBoard() {
    if (!messageBoardView) {
      const live = el('button', { className: 'btn', onClick: () => { S.boardSource = 'live'; render(); } });
      const history = el('button', { className: 'btn', onClick: () => { S.boardSource = 'history'; render(); } });
      const more = el('button', { className: 'btn', onClick: () => loadHistory(S.group, S.groupReqId, true) });
      const body = el('section', { className: 'panel-b' });
      const panel = el('section', { className: 'panel board-view-panel' },
        el('div', { className: 'panel-h' }, el('div', { className: 'toolbar' }, live, history, more)), body);
      messageBoardView = { panel, live, history, more, board: mountViaMessageBoard(body) };
    }
    const view = messageBoardView;
    if (!$main.contains(view.panel)) $main.replaceChildren(view.panel);

    const pinned = S.replaySeq !== null;
    const liveMessages = normalizeLiveMessages(S.board.peerEvents, S.group);
    const historyMessages = pinned ? aggregateHistoryMessages(S.replay?.events, S.replaySeq) : aggregateHistoryMessages(S.hist.events, null);
    const showingHistory = pinned || S.boardSource === 'history';
    view.live.textContent = groupIsLive() ? '实时窗口（' + liveMessages.length + '）' : '实时未连接';
    view.live.disabled = pinned || !groupIsLive();
    view.history.disabled = pinned;
    view.history.textContent = (pinned ? '历史锚点 #' + S.replaySeq : '已录历史') + '（' + historyMessages.length + '）';
    view.live.classList.toggle('active', !showingHistory);
    view.history.classList.toggle('active', showingHistory);
    view.live.setAttribute('aria-pressed', String(!showingHistory));
    view.history.setAttribute('aria-pressed', String(showingHistory));
    view.more.hidden = pinned || !showingHistory || !S.hist.hasMore;
    view.more.style.display = view.more.hidden ? 'none' : '';
    view.more.disabled = S.hist.loading;
    view.more.textContent = S.hist.loading ? '加载中…' : '继续加载历史';

    view.board.update({
      group: deskScope(),
      source: pinned ? 'replay:' + S.replaySeq : S.boardSource,
      messages: attachMessageAvatars((showingHistory ? historyMessages : liveMessages).slice().reverse(),
        pinned ? S.replay?.members : showingHistory ? S.hist.members : S.board.tasks),
      tasks: showingHistory ? [] : S.board.tasks,
      loading: pinned ? S.replayLoading : showingHistory ? S.hist.loading : S.loading && !S.lastBoardAt,
      error: pinned ? S.replayError : showingHistory ? S.hist.error : S.error,
      retry: pinned ? () => enterReplay(S.replaySeq) : showingHistory ? () => loadHistory(S.group, S.groupReqId, false) : () => loadBoard(S.group, S.groupReqId, false)
    });
    if (S.highlightMsgId && view.board.reveal(S.highlightMsgId)) S.highlightMsgId = '';
  }

  function projectOverview() {
    const live = S.lastBoardAt > 0 && groupIsLive() && !S.error;
    const events = S.hist.events;
    const sentIds = new Set(events.filter(e => e.type === 'message_sent' || e.type === 'message_reply')
      .filter(e => e.messageId).map(e => String(e.messageId)));
    const byId = new Map(aggregateHistoryMessages(events, null).filter(m => sentIds.has(m.id)).map(m => [m.id, m]));
    if (live) {
      const sourceRows = S.board.peerEvents.filter(m => m && (m.id || m.messageId) && !m.receiptOnly &&
        !['message_delivery', 'message_read', 'message_task_state'].includes(m.type || m.eventType) &&
        (m.sentAt != null || (typeof m.text === 'string' && m.text.trim()) || m.summary));
      for (const m of normalizeLiveMessages(sourceRows, S.group)) {
        const history = byId.get(m.id);
        byId.set(m.id, history ? {
          ...history,
          fromAvatarUrl: m.fromAvatarUrl, toAvatarUrl: m.toAvatarUrl,
          sentAt: history.sentAt ?? m.sentAt, readAt: history.readAt ?? m.readAt,
          receiptAt: history.receiptAt ?? m.receiptAt,
          delivery: m.delivery || history.delivery,
          confirmedDelivered: history.confirmedDelivered || m.confirmedDelivered,
        } : m);
      }
    }
    const time = value => typeof value === 'number' ? value : Date.parse(value);
    const recent = Array.from(byId.values()).sort((a, b) =>
      (time(b.sentAt) || 0) - (time(a.sentAt) || 0) || (b.seq || 0) - (a.seq || 0)).slice(0, 8);
    const count = byId.size;
    const complete = S.hist.loaded && !S.hist.hasMore && !S.hist.error && !(S.error && groupIsLive());
    const failed = S.hist.error || (S.error && (!S.hist.loaded || groupIsLive()));
    const countState = failed ? 'error' : complete ? 'complete' : count ? 'partial' : 'loading';
    const countDisplay = complete ? String(count) : count ? '≥ ' + count : failed ? '—' : '…';
    const countSub = failed ? (count ? '已确认下限 · 读取失败' : '信件总数暂无法确认')
      : complete ? '原信 + 回信，按信件去重'
      : count ? '已确认下限 · 正在读取历史' : '正在读取信件记录';
    return { live, recent, countState, countDisplay, countSub };
  }

  function renderOverview() {
    const ov = projectOverview();
    const tasks = ov.live ? S.board.tasks : [];
    const histMembers = S.hist.members || [];
    const members = ov.live ? tasks : histMembers;
    const memberReady = ov.live || S.hist.loaded;
    const counts = { working: 0, waiting: 0, completed: 0, exited: 0 };
    for (const m of members) {
      const kind = classifyState(m, !ov.live).kind;
      if (kind in counts) counts[kind]++;
    }
    const mark = ov.live ? '实时' : memberReady ? '末次记录' : S.error || S.hist.error ? '待确认' : '读取中';
    const prefix = ov.live ? '' : '末次 · ';
    const metric = (title, value, detail, badge, id) => el('div', { className: 'kpi' },
      el('div', { className: 'kpi-l' }, title, el('span', { className: 'badge ' + badge }, id ? '按本批次' : mark)),
      el('div', { className: 'kpi-v', id, 'data-state': id ? ov.countState : null }, value),
      el('div', { className: 'kpi-s' }, detail));
    const shown = value => memberReady ? String(value) : S.error || S.hist.error ? '—' : '…';
    const kpis = el('section', { className: 'kpis', 'aria-label': '核心指标' },
      metric(ov.live ? '在岗总数' : '末次记录 · 工作或待命', shown(counts.working + counts.waiting),
        memberReady ? prefix + '工作 ' + counts.working + ' · 待命 ' + counts.waiting : '正在确认成员状态', ov.live ? 'st-working' : 'st-hist'),
      metric(ov.live ? '在岗待命' : '末次记录 · 待命', shown(counts.waiting), '等待收件', ov.live ? 'st-waiting' : 'st-hist'),
      metric(ov.live ? '本轮完成' : '末次记录 · 本轮完成', shown(counts.completed),
        memberReady ? prefix + '已退场 ' + counts.exited : '按成员记录计算', ov.live ? 'st-completed' : 'st-hist'),
      metric(ov.live ? '实时成员' : '末次记录 · 成员', shown(members.length), '对应下方成员列表', 'st-hist'),
      metric('本批次信件', ov.countDisplay, ov.countSub, 'st-hist', 'deskLetterCount')
    );

    const leftBody = el('div', { className: 'panel-b' });
    if (tasks.length) {
      const list = el('div', { className: 'row-list' });
      for (const t of tasks) {

  function renderMemberFullRecord(label, detail, isOpen, onToggle) {
    const keyText = label == null ? '' : String(label).trim();
    let hash = 2166136261;
    for (let i = 0; i < keyText.length; i += 1) {
      hash ^= keyText.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    const panelId = 'dm-record-panel-' + (hash >>> 0).toString(36);

    let open = Boolean(isOpen);
    const wrap = el('div', { className: 'dm-record-disclosure' });

    const btn = el('button', { className: 'dm-record-toggle' });
    btn.type = 'button';
    btn.setAttribute('aria-controls', panelId);
    btn.dataset.memberFocus = 'member-full-record';

    const panel = el('div', { className: 'dm-record-panel' });
    panel.id = panelId;
    panel.dataset.memberFocus = 'member-record-region';
    panel.setAttribute('role', 'region');
    panel.setAttribute('aria-label', keyText ? keyText + ' 完整记录' : '完整记录');

    if (detail instanceof Node) {
      panel.appendChild(detail);
    } else if (Array.isArray(detail) && detail.length > 0) {
      for (let i = 0; i < detail.length; i += 1) {
        const item = detail[i];
        if (item instanceof Node) panel.appendChild(item);
        else if (item != null) panel.appendChild(document.createTextNode(String(item)));
      }
    } else if (typeof detail === 'string' && detail.trim()) {
      panel.appendChild(el('p', { className: 'dm-record-empty', text: detail }));
    } else {
      panel.appendChild(el('p', { className: 'dm-record-empty', text: '暂无可展示的完整记录' }));
    }

    const sync = () => {
      wrap.dataset.recordOpen = open ? 'true' : 'false';
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = open ? '收起完整记录' : '查看完整记录';
      if (keyText) {
        btn.setAttribute('aria-label', (open ? '收起完整记录：' : '查看完整记录：') + keyText);
      }
      panel.hidden = !open;
      if (open) {
        panel.setAttribute('tabindex', '0');
      } else {
        panel.removeAttribute('tabindex');
      }
    };

    btn.addEventListener('click', () => {
      open = !open;
      sync();
      if (typeof onToggle === 'function') {
        onToggle(open);
      }
    });

    sync();
    wrap.appendChild(btn);
    wrap.appendChild(panel);
    return wrap;
  }

  function lastGroupLetter(events) {
    for (let i = (events || []).length - 1; i >= 0; i--) {
      const event = events[i];
      if ((event.type === 'message_sent' || event.type === 'message_reply') && event.messageId) return event;
    }
    return null;
  }

  function readMemberActivityTail() {
    const { group, groupReqId } = S;
    const head = S.hist.head;
    const key = JSON.stringify([deskScope(), head]);
    const firstUnloaded = Number(S.hist.next);
    if (!S.hist.loaded || !S.hist.hasMore || !Number.isSafeInteger(head) || head <= firstUnloaded) return null;
    if (memberActivityTails.has(key)) return memberActivityTails.get(key);
    const result = { pending: true, event: null, error: false };
    memberActivityTails.set(key, result);
    (async () => {
      for (let end = head; end > firstUnloaded; end -= PAGE_LIMIT) {
        const after = Math.max(firstUnloaded, end - PAGE_LIMIT);
        const data = await fetchJson(apiUrl('/api/history', { group, after, at: end, limit: PAGE_LIMIT }));
        if (S.groupReqId !== groupReqId || S.hist.head !== head || S.tab !== 'members' || S.replaySeq !== null) {
          memberActivityTails.delete(key);
          return;
        }
        result.event = lastGroupLetter(data.events);
        if (result.event) break;
      }
    })().catch(() => { result.error = true; }).finally(() => {
      result.pending = false;
      if (memberActivityTails.has(key) && S.groupReqId === groupReqId && S.hist.head === head && S.tab === 'members' && S.replaySeq === null) render();
    });
    return result;
  }
