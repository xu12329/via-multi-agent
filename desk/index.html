<!doctype html>
<html lang="zh-CN" class="denia-theme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Via Desk · 多代理通信桌</title>
<style>
:root{
  --bg:#0b1018;--bg2:#111926;--card:#151f2f;--card2:#1b273b;
  --line:#243348;--line2:#334966;--fg:#e6edf6;--muted:#93a4bc;--dim:#647791;
  --gold:#d49b54;--gold-bg:rgba(212,155,84,.15);--cyan:#47b6d0;--cyan-bg:rgba(71,182,208,.15);
  --ok:#55bf88;--ok-bg:rgba(85,191,136,.14);--warn:#e0aa50;--warn-bg:rgba(224,170,80,.15);
  --err:#e06b74;--err-bg:rgba(224,107,116,.15);--exit:#8c98a8;--exit-bg:rgba(140,152,168,.14);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 16px;background:rgba(11,16,24,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.04em}
.brand-mark{
  width:22px;height:22px;display:grid;place-items:center;font-size:11px;color:var(--bg);
  background:linear-gradient(135deg,var(--gold),var(--cyan));
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
}
.brand-sub{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.grp-box{display:flex;align-items:center;gap:6px}
.grp-box label{font-size:12px;color:var(--muted)}
select,input[type=search]{
  background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;color:var(--fg);min-height:32px;
}
select:hover,input[type=search]:hover{border-color:var(--cyan)}
.tabs{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:8px;border:1px solid var(--line)}
.tab{
  background:transparent;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;color:var(--muted);font-weight:500;
}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{background:var(--card2);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(212,155,84,.4)}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:12px;border:1px solid var(--line2);background:var(--bg2);white-space:nowrap;
}
.pill.live{border-color:rgba(71,182,208,.5);color:var(--cyan);background:var(--cyan-bg)}
.pill.replay{border-color:rgba(212,155,84,.55);color:var(--gold);background:var(--gold-bg)}
.pill.err{border-color:rgba(224,107,116,.55);color:var(--err);background:var(--err-bg)}
.btn{
  background:var(--card2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;
  cursor:pointer;color:var(--fg);min-height:30px;font-size:12px;display:inline-flex;align-items:center;gap:5px;
}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.active{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-bg)}
.btn.gold{border-color:rgba(212,155,84,.6);color:var(--gold);background:var(--gold-bg)}
.main{flex:1;padding:12px 16px 20px;max-width:1680px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.banner{
  padding:8px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap;
}
.banner.warn{border-color:rgba(212,155,84,.5);background:var(--gold-bg);color:#f3d2a3}
.banner.err{border-color:rgba(224,107,116,.5);background:var(--err-bg);color:#f7b6bc}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi-l{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi-v{font-size:22px;font-weight:700;margin-top:3px;font-family:var(--mono)}
.kpi-s{font-size:11px;color:var(--dim);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-h{
  padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:8px;background:rgba(17,25,38,.7);flex-wrap:wrap;
}
.panel-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-b{padding:10px 12px}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:5px;
  font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap;
}
.st-working{color:var(--cyan);background:var(--cyan-bg);border-color:rgba(71,182,208,.4)}
.st-waiting{color:var(--warn);background:var(--warn-bg);border-color:rgba(224,170,80,.4)}
.st-completed{color:var(--ok);background:var(--ok-bg);border-color:rgba(85,191,136,.4)}
.st-exited{color:var(--exit);background:var(--exit-bg);border-color:rgba(140,152,168,.4);border-style:dashed}
.st-failed{color:var(--err);background:var(--err-bg);border-color:rgba(224,107,116,.45)}
.st-unknown{color:var(--muted);background:rgba(147,164,188,.1);border-color:rgba(147,164,188,.35);border-style:dotted}
.st-hist{color:var(--gold);background:var(--gold-bg);border-color:rgba(212,155,84,.4)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.row-list{display:flex;flex-direction:column;gap:8px}
.task-row{
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg2);
  display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%;
}
.task-row:hover{border-color:var(--cyan);background:var(--card2)}
.row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-name{font-weight:600;font-size:13px}
.meta-inline{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-family:var(--mono)}
.snippet{
  margin:0;padding:6px 8px;border-radius:6px;background:rgba(11,16,24,.8);border:1px solid var(--line);
  font:12px/1.4 var(--mono);color:#c7d4e6;white-space:pre-wrap;word-break:break-word;max-height:74px;overflow:hidden;
}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:190px}
.msg-item{border:1px solid var(--line);border-radius:8px;background:var(--bg2);overflow:hidden}
.msg-item.hl{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.msg-head{
  width:100%;background:transparent;border:0;padding:9px 11px;cursor:pointer;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:left;
}
.msg-head:hover{background:rgba(27,39,59,.6)}
.msg-route{font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.msg-preview{color:var(--muted);font-size:12px;flex:1;min-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-detail{border-top:1px solid var(--line);padding:10px 11px;background:rgba(11,16,24,.65);display:flex;flex-direction:column;gap:8px}
.msg-body{
  margin:0;padding:9px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);
  font:12.5px/1.5 var(--mono);color:var(--fg);white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;
}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 12px;font-size:12px}
.kv{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.kv-k{font-size:11px;color:var(--dim)}
.kv-v{font-family:var(--mono);font-size:12px;word-break:break-all}
.members-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.95fr);gap:12px;align-items:start}
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.m-card{
  background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;
  text-align:left;display:flex;gap:10px;align-items:flex-start;width:100%;
}
.m-card:hover{border-color:var(--cyan);background:var(--card2)}
.m-card.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(212,155,84,.4)}
.hex-wrap{
  width:46px;height:50px;flex:none;display:grid;place-items:center;position:relative;
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:var(--line2);
}
.hex-wrap.st-working{background:var(--cyan)}
.hex-wrap.st-waiting{background:var(--warn)}
.hex-wrap.st-completed{background:var(--ok)}
.hex-wrap.st-exited{background:var(--exit)}
.hex-wrap.st-failed{background:var(--err)}
.hex-wrap.st-unknown{background:var(--dim)}
.hex-in{
  width:42px;height:46px;display:grid;place-items:center;background:var(--bg);
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  font-weight:700;font-size:13px;font-family:var(--mono);color:var(--fg);
}
.m-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.m-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.graph-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.8fr);gap:12px;align-items:stretch}
.graph-stage{
  position:relative;min-height:530px;background:radial-gradient(circle at 50% 50%,#152236 0%,#0c1320 70%,#0a0f18 100%);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.graph-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.graph-layer{position:absolute;inset:0;pointer-events:none}
.core-node{
  position:absolute;transform:translate(-50%,-50%);width:116px;height:126px;pointer-events:auto;
  display:grid;place-items:center;clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  background:linear-gradient(155deg,var(--gold),var(--cyan));border:0;padding:0;cursor:pointer;
}
.core-in{
  width:110px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px;text-align:center;background:#0e1726;
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
}
.core-name{font-size:12px;font-weight:700;color:var(--gold);max-width:94px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.core-sub{font-size:10px;color:var(--muted)}
.hex-node{
  position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:transparent;border:0;
  padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:132px;
}
.hex-node .hex-wrap{width:64px;height:70px;transition:transform .12s ease}
.hex-node .hex-in{width:58px;height:64px;font-size:15px}
.hex-node:hover .hex-wrap,.hex-node.sel .hex-wrap{transform:scale(1.07)}
.hex-node.sel .hex-in{background:#182840;color:var(--gold)}
.node-cap{
  background:rgba(11,16,24,.9);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;
  font-size:11px;max-width:130px;text-align:center;line-height:1.3;
}
.hex-node.sel .node-cap{border-color:var(--gold)}
.node-cap-n{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-note{
  position:absolute;left:12px;bottom:10px;z-index:2;padding:4px 9px;border-radius:6px;
  background:rgba(11,16,24,.86);border:1px solid var(--line);font-size:11px;color:var(--muted);
}
.stage-legend{
  position:absolute;right:12px;bottom:10px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;
  padding:4px 9px;border-radius:6px;background:rgba(11,16,24,.86);border:1px solid var(--line);font-size:11px;color:var(--muted);
}
.rel-list{padding:12px;display:flex;flex-direction:column;gap:10px}
.rel-edge{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;width:100%;text-align:left;
}
.rel-edge:hover{border-color:var(--cyan)}
.timeline-bar{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.timeline-bar select{max-width:390px;min-width:210px;flex:1}
.ev-list{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.ev-row{
  border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--bg2);
  font-size:12px;display:flex;flex-direction:column;gap:3px;
}
.link-btn{
  background:transparent;border:1px solid var(--line2);border-radius:5px;padding:2px 7px;
  font-size:11px;color:var(--cyan);cursor:pointer;font-family:var(--mono);
}
.link-btn:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid2,.members-layout,.graph-wrap{grid-template-columns:1fr}
  .graph-stage{min-height:420px}
}
@media(max-width:640px){
  .topbar{padding:8px 10px;gap:8px}
  .main{padding:10px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top-meta{margin-left:0}
}
</style>
<style id="denia-theme">
  html.denia-theme {
    --bg: #fbf5f3;
    --bg2: #f7e9e4;
    --card: rgba(255, 252, 250, 0.9);
    --card2: #f8eeec;
    --line: rgba(154, 136, 146, 0.28);
    --line2: rgba(136, 118, 132, 0.44);
    --fg: #1d1a22;
    --muted: #5a5261;
    --dim: #7b7182;
    --gold: #845020;
    --gold-bg: rgba(235, 175, 126, 0.28);
    --cyan: #245680;
    --cyan-bg: rgba(187, 209, 237, 0.36);
    --ok: #215e45;
    --ok-bg: rgba(196, 226, 210, 0.5);
    --warn: #7d4c17;
    --warn-bg: rgba(236, 192, 144, 0.4);
    --err: #962a3f;
    --err-bg: rgba(234, 192, 201, 0.48);
    --exit: #524c5b;
    --exit-bg: rgba(203, 197, 202, 0.42);
    --denia-graph-guide: rgba(152, 138, 149, 0.32);
    --denia-graph-spoke: rgba(138, 122, 136, 0.48);
    --denia-graph-spoke-active: #35638f;
    --denia-graph-edge: #6f6270;
    --denia-graph-confirmed: #27664c;
    --denia-graph-edge-active: #245680;
    --denia-graph-edge-paper: #fbf5f3;
    --denia-graph-edge-ink: #1d1a22;
    color-scheme: light;
  }

  html.denia-theme body {
    color: var(--fg);
    background:
      radial-gradient(58rem 32rem at 92% -4%, rgba(211, 229, 249, 0.4), transparent 62%),
      radial-gradient(48rem 26rem at 8% 10%, rgba(234, 192, 201, 0.26), transparent 64%),
      linear-gradient(155deg, #fbf5f3 0%, #fde6e0 100%);
    background-attachment: fixed;
  }

  html.denia-theme .topbar {
    background: linear-gradient(90deg, rgba(251, 245, 243, 0.95), rgba(253, 230, 224, 0.88));
    border-bottom: 1px solid var(--line);
    box-shadow: 0 4px 18px rgba(102, 76, 86, 0.06);
    backdrop-filter: blur(10px);
  }
  html.denia-theme .brand { color: var(--fg); gap: 10px; }
  html.denia-theme .brand-mark { color: var(--fg); letter-spacing: 0.01em; }
  html.denia-theme .brand-sub,
  html.denia-theme .top-meta { color: var(--muted); }
  html.denia-theme .grp-box {
    background: linear-gradient(135deg, rgba(255, 252, 250, 0.94), rgba(234, 192, 201, 0.24));
    border: 1px solid var(--line); color: var(--fg);
  }
  html.denia-theme .tabs {
    background: linear-gradient(135deg, rgba(234, 192, 201, 0.24), rgba(203, 197, 202, 0.26));
    border: 1px solid var(--line);
  }
  html.denia-theme .tab[aria-selected=true] {
    background: linear-gradient(135deg, #bbd1ed, #d3e5f9);
    color: var(--fg); border-color: rgba(88, 130, 176, 0.46);
    box-shadow: 0 1px 4px rgba(56, 88, 128, 0.14);
  }
  html.denia-theme .pill.live { background: var(--ok-bg); color: var(--ok); border-color: rgba(33, 94, 69, 0.36); }
  html.denia-theme .pill.replay { background: var(--gold-bg); color: var(--gold); border-color: rgba(132, 80, 32, 0.34); }
  html.denia-theme .btn,
  html.denia-theme .link-btn { background: rgba(255, 252, 250, 0.92); color: var(--fg); border-color: var(--line2); }
  html.denia-theme .btn:hover:not(:disabled),
  html.denia-theme .link-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(187, 209, 237, 0.44), rgba(211, 229, 249, 0.58));
    border-color: rgba(88, 130, 176, 0.5);
  }
  html.denia-theme .main { color: var(--fg); }

  html.denia-theme .denia-hero {
    position: relative; display: flex; align-items: center; overflow: hidden;
    height: clamp(144px, 15.5vw, 184px); margin-bottom: 14px; border-radius: 16px;
    border: 1px solid var(--line);
    background:
      linear-gradient(125deg, rgba(251, 245, 243, 0.96) 0%, rgba(211, 229, 249, 0.42) 58%, rgba(234, 192, 201, 0.34) 100%);
    box-shadow: 0 8px 24px rgba(102, 76, 86, 0.08);
  }
  html.denia-theme .denia-hero-copy {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    max-width: 54%; padding: 18px 24px;
  }
  html.denia-theme .denia-hero-title {
    margin: 0; font-size: clamp(1.18rem, 1.9vw, 1.52rem); line-height: 1.2;
    font-weight: 700; letter-spacing: 0.02em; color: var(--fg);
  }
  html.denia-theme .denia-hero-group {
    padding: 3px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
    color: var(--cyan); border: 1px solid rgba(88, 130, 176, 0.36);
    background: linear-gradient(135deg, rgba(255, 252, 250, 0.88), rgba(211, 229, 249, 0.64));
  }
  html.denia-theme .denia-hero-group:empty { padding: 0; border-color: transparent; background: transparent; }

  html.denia-theme .banner.warn {
    background: linear-gradient(90deg, rgba(235, 175, 126, 0.34), rgba(236, 192, 144, 0.24));
    color: var(--warn); border-color: rgba(132, 80, 32, 0.38);
  }
  html.denia-theme .banner.err {
    background: linear-gradient(90deg, rgba(234, 192, 201, 0.5), rgba(253, 230, 224, 0.6));
    color: var(--err); border-color: rgba(150, 42, 63, 0.4);
  }
  html.denia-theme .kpis { gap: 12px; }
  html.denia-theme .grid2 { gap: 14px; }
  html.denia-theme .kpi,
  html.denia-theme .panel,
  html.denia-theme .m-card {
    background: var(--card); border-color: var(--line);
    box-shadow: 0 4px 16px rgba(102, 76, 86, 0.06);
  }
  html.denia-theme .panel-h {
    background: linear-gradient(90deg, rgba(251, 245, 243, 0.96), rgba(234, 192, 201, 0.24), rgba(203, 197, 202, 0.2));
    color: var(--fg); border-bottom-color: var(--line);
  }
  html.denia-theme .panel-b { background: transparent; color: var(--fg); }
  html.denia-theme .badge { border-width: 1px; font-weight: 600; }
  html.denia-theme .st-working { background: var(--cyan-bg); color: var(--cyan); border-color: rgba(36, 86, 128, 0.44); border-style: solid; }
  html.denia-theme .st-waiting { background: var(--warn-bg); color: var(--warn); border-color: rgba(125, 76, 23, 0.44); border-style: dashed; }

<script>
(function (global) {
  'use strict';

  var THEME_KEY = 'via-desk-theme-pref';
  var VALID_PREFS = { day: 1, night: 1, system: 1 };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = String(text);

  function strId(v) {

  function pad2(n) {
    return n < 10 ? '0' + n : String(n);

  function parseMs(v) {
    if (v == null || v === '') return NaN;
    if (typeof v === 'number') return v > 0 && v < 1e12 ? v * 1000 : v;
    var s = String(v).trim();
    if (!s) return NaN;
    if (/^\d{10,13}$/.test(s)) {
      var num = Number(s);
      return num < 1e12 ? num * 1000 : num;

    var ms = Date.parse(s);
    return isNaN(ms) ? NaN : ms;
  }

  function fmtTime(v, full) {
    if (v == null || v === '') return '';
    var ms = parseMs(v);

    var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());

  function hashIdx(str) {

    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;

  function normTaskState(raw) {
    if (raw == null) return null;
    var s = String(raw).trim();
    if (!s) return null;
    var k = s.toLowerCase();
    if (k === 'running' || k === 'in_progress' || k === 'active' || k === 'working' || k === 'executing' || s === '运行中') {
      return { cls: 'running', label: '运行中', mark: '▶' };
    }
    if (k === 'completed' || k === 'done' || k === 'finished' || k === 'succeeded' || k === 'success' || s === '已完成') {
      return { cls: 'done', label: '已完成', mark: '✓' };
    }
    if (k === 'waiting' || k === 'pending' || k === 'queued' || k === 'idle' || k === 'paused' || k === 'blocked' || s === '等待') {
      return { cls: 'waiting', label: '等待', mark: '◔' };
    }
    if (k === 'failed' || k === 'error' || k === 'errored' || k === 'cancelled' || k === 'canceled' || k === 'aborted' || k === 'timeout' || k === 'timed_out' || s === '失败') {
      return { cls: 'failed', label: '失败', mark: '✕' };
    }
    return { cls: 'unknown', label: '状态未知', mark: '○' };
  }

  function sourceLabel(src) {
    if (!src || src === 'live') return '实时通信';
    if (src === 'history') return '历史信件';
    if (String(src).indexOf('replay:') === 0) return '回放 #' + String(src).slice(7);
    return String(src);
  }

  function isConfirmedDelivered(m) {
    return m.confirmedDelivered === true || m.delivery === 'delivered' || m.providerPhase === 'delivered';
  }

  function buildIndex(messages, tasks) {
    var byId = new Map();
    var idxById = new Map();
    var list = [];
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (!m || m.id == null || String(m.id) === '') continue;
      var id = String(m.id);
      if (byId.has(id)) continue;
      byId.set(id, m);
      idxById.set(id, i);
      list.push(m);
    }

    var tasksById = new Map();
    var avatarByActor = new Map();
    for (var t = 0; t < tasks.length; t++) {
      var tk = tasks[t];
      if (!tk) continue;
      if (tk.id != null && String(tk.id) !== '') tasksById.set(String(tk.id), tk);
      if (tk.actorId && tk.avatarUrl && !avatarByActor.has(String(tk.actorId))) {
        avatarByActor.set(String(tk.actorId), tk.avatarUrl);
      }
    }

    var rootOf = new Map();
    var orphanRoots = new Set();
    var directReplies = new Map();

    for (var j = 0; j < list.length; j++) {
      var msg = list[j];
      var mid = String(msg.id);
      var rto = strId(msg.replyTo);
      if (rto && rto !== mid) {
        if (!directReplies.has(rto)) directReplies.set(rto, []);
        directReplies.get(rto).push(msg);
      }
    }

    function pickCycleRoot(cycleIds) {
      var best = cycleIds[0];
      var bestMs = parseMs(byId.get(best).sentAt);
      var bestIdx = idxById.get(best);
      for (var c = 1; c < cycleIds.length; c++) {
        var cid = cycleIds[c];
        var ms = parseMs(byId.get(cid).sentAt);
        var idx = idxById.get(cid);
        var msBetter = !isNaN(ms) && (isNaN(bestMs) || ms < bestMs);
        var sameMs = (isNaN(ms) && isNaN(bestMs)) || ms === bestMs;
        if (msBetter || (sameMs && (idx > bestIdx || (idx === bestIdx && cid < best)))) {
          best = cid;
          bestMs = ms;
          bestIdx = idx;
        }
      }
      return best;
    }

    for (var k = 0; k < list.length; k++) {
      var startId = String(list[k].id);
      if (rootOf.has(startId)) continue;
      var path = [];
      var pos = new Map();
      var cur = startId;
      var resolved = '';
      while (true) {
        if (rootOf.has(cur)) {
          resolved = rootOf.get(cur);
          break;
        }
        if (pos.has(cur)) {
          resolved = pickCycleRoot(path.slice(pos.get(cur)));
          orphanRoots.add(resolved);
          break;
        }
        pos.set(cur, path.length);
        path.push(cur);
        var curMsg = byId.get(cur);
        var parentId = strId(curMsg.replyTo);
        if (!parentId) {
          resolved = cur;
          break;
        }
        if (!byId.has(parentId)) {
          resolved = cur;
          orphanRoots.add(cur);
          break;
        }
        cur = parentId;
      }
      for (var p = 0; p < path.length; p++) rootOf.set(path[p], resolved);
    }

    var childrenOf = new Map();
    for (var n = 0; n < list.length; n++) {
      var item = list[n];
      var iid = String(item.id);
      var rid = rootOf.get(iid);
      if (iid === rid) continue;
      var pid = strId(item.replyTo);
      if (!byId.has(pid) || pid === iid) pid = rid;
      if (!childrenOf.has(pid)) childrenOf.set(pid, []);
      childrenOf.get(pid).push(item);
    }

    function sortAsc(a, b) {
      var ma = parseMs(a.sentAt);
      var mb = parseMs(b.sentAt);
      if (!isNaN(ma) && !isNaN(mb) && ma !== mb) return ma - mb;
      return idxById.get(String(b.id)) - idxById.get(String(a.id));
    }

    childrenOf.forEach(function (arr) { arr.sort(sortAsc); });

    var threads = [];
    var threadByRoot = new Map();
    var threadByMsg = new Map();

    byId.forEach(function (rootMsg, rootId) {
      if (rootOf.get(rootId) !== rootId) return;
      var replies = [];
      var visited = new Set([rootId]);
      function walk(pid, depth) {
        var kids = childrenOf.get(pid);
        if (!kids) return;
        for (var i = 0; i < kids.length; i++) {
          var ch = kids[i];
          var cid = String(ch.id);
          if (visited.has(cid)) continue;
          visited.add(cid);
          replies.push({ msg: ch, depth: Math.min(depth, 4) });
          walk(cid, depth + 1);
        }
      }
      walk(rootId, 1);

      var allMsgs = [rootMsg];
      for (var r = 0; r < replies.length; r++) allMsgs.push(replies[r].msg);
      var minIdx = idxById.get(rootId);
      var maxMs = parseMs(rootMsg.sentAt);
      for (var a = 1; a < allMsgs.length; a++) {
        var am = allMsgs[a];
        var ai = idxById.get(String(am.id));
        if (ai < minIdx) minIdx = ai;
        var ams = parseMs(am.sentAt);
        if (!isNaN(ams) && (isNaN(maxMs) || ams > maxMs)) maxMs = ams;
      }

      var th = {
        rootId: rootId,
        root: rootMsg,
        isOrphan: orphanRoots.has(rootId),
        replies: replies,
        allMsgs: allMsgs,
        minIdx: minIdx,
        maxMs: maxMs
      };
      threads.push(th);
      threadByRoot.set(rootId, th);
      for (var u = 0; u < allMsgs.length; u++) threadByMsg.set(String(allMsgs[u].id), th);
    });

    threads.sort(function (a, b) {
      if (a.minIdx !== b.minIdx) return a.minIdx - b.minIdx;
      if (!isNaN(a.maxMs) && !isNaN(b.maxMs) && a.maxMs !== b.maxMs) return b.maxMs - a.maxMs;
      return a.rootId < b.rootId ? -1 : 1;
    });

    var memberSet = new Set();
    for (var q = 0; q < list.length; q++) {
      if (list[q].from) memberSet.add(String(list[q].from));
      if (list[q].to) memberSet.add(String(list[q].to));
    }
    var members = Array.from(memberSet).sort();

    return {
      threads: threads,
      threadByRoot: threadByRoot,
      threadByMsg: threadByMsg,
      tasksById: tasksById,
      avatarByActor: avatarByActor,
      directReplies: directReplies,
      members: members
    };
  }

  function resolveTaskInfo(msg, tasksById) {
    var tid = strId(msg.taskId).trim();
    var matched = tid ? (tasksById.get(tid) || null) : null;
    var msgState = normTaskState(msg.taskState);
    var taskState = !msgState && matched ? normTaskState(matched.state || matched.processState) : null;
    var resolved = msgState || taskState;
    if (!tid && !msgState) return null;
    return {
      taskId: tid,
      state: resolved || { cls: 'unknown', label: '状态未知', mark: '○' },
      worker: matched && matched.worker ? String(matched.worker) : '',
      processState: matched && matched.processState ? String(matched.processState) : ''

  }

  function msgMatchesQuery(msg, q, tasksById) {

  function messageSummary(message) {
    const supplied = typeof message.summary === 'string' ? message.summary.trim() : '';
    const line = String(message.text || '').split(/\r?\n/).map(row => row.replace(/^(?:#+\s+|>\s+|[-*]\s+)/, '').trim())
      .find(row => /[\p{L}\p{N}]/u.test(row));
    const source = supplied || line || '（无摘要）';
    const sentence = source.match(/^(.{5,96}?[。！？]|.{5,96}?[.!?](?=\s|$))/)?.[1] || source;
    const chars = Array.from(sentence.replace(/\s+/g, ' '));
    return chars.length > 96 ? chars.slice(0, 95).join('') + '…' : chars.join('');
  }

        }));
      }
      $run.value = activeRunId;
      S.runOptions = key;
    } else {
      if ($run.disabled !== isDisabled) $run.disabled = isDisabled;
      if ($run.value !== activeRunId) $run.value = activeRunId;
    }

    if ($run.title !== activeRunId) $run.title = activeRunId;
  }

  function deskScope() {
    return JSON.stringify([S.group, S.runId]);
  }
  const $meta = document.getElementById('topMeta');
  const $main = document.getElementById('mainView');
  const $tabs = Array.from(document.querySelectorAll('.tab'));

  function el(tag, props, ...children) {
    const n = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'className') n.className = v;
        else if (k === 'text') n.textContent = String(v);
        else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
        else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'value') n.value = String(v);
        else if (k === 'disabled' || k === 'selected' || k === 'checked') n[k] = Boolean(v);
        else n.setAttribute(k, v === true ? '' : String(v));
      }
    }
    const append = (c) => {
      if (c === undefined || c === null || c === false) return;
      if (Array.isArray(c)) c.forEach(append);
      else if (c instanceof Node) n.appendChild(c);
      else n.appendChild(document.createTextNode(String(c)));
    };
    children.forEach(append);
    return n;
  }

  function apiUrl(path, params) {
    if (!params) return path;
    const sp = new URLSearchParams();
    if (params.group && S.runId) sp.set('runId', S.runId);
    for (const [k, v] of Object.entries(params)) {
      if (v !== undefined && v !== null && v !== '') sp.set(k, String(v));
    }
    const q = sp.toString();
    return q ? path + '?' + q : path;
  }

  const DESK_TOKEN_KEY = 'via-desk-auth';
  const SCOPED_API = new Set([
    '/api/board',
    '/api/history',
    '/api/identity',
    '/api/folder/select',
    '/api/folder/return',
    '/api/folder/projects',
    '/api/folder/open',
  ]);
  const FOLDER_API = new Set(['/api/folder/select', '/api/folder/return', '/api/folder/open']);
  const FOLDER_SELECT_TIMEOUT_MS = 130000;
  const FOLDER_RETURN_TIMEOUT_MS = 30000;
  const FOLDER_OPEN_TIMEOUT_MS = 30000;
  const folderState = {
    mode: 'session',
    folder: '',
    canReturn: false,
    canChooseFolder: false,
    busy: false,
    action: '',
    openingProjectId: '',
    error: '',
    notice: '',
    identityChecked: false,
  };
  const projectsState = {
    loading: false,
    loaded: false,
    error: '',
    items: [],
    reqId: 0,
    lastRenderKey: '',
  };
  const deskToken = (() => {
    const fragment = new URLSearchParams(location.hash.slice(1));
    const valid = value => typeof value === 'string' && /^[0-9a-f]{64}$/.test(value);
    if (fragment.has('desk')) {
      const supplied = fragment.get('desk');
      history.replaceState(history.state, '', location.pathname + location.search);
      try {
        if (valid(supplied)) sessionStorage.setItem(DESK_TOKEN_KEY, supplied);
        else sessionStorage.removeItem(DESK_TOKEN_KEY);
      } catch (_) {}
      return valid(supplied) ? supplied : '';
    }
    try {
      const stored = sessionStorage.getItem(DESK_TOKEN_KEY);
      return valid(stored) ? stored : '';
    } catch (_) { return ''; }
  })();

  function applyFolderMeta(data) {
    if (!data || typeof data !== 'object') return false;
    let touched = false;
    if (data.mode === 'folder' || data.mode === 'session') {
      folderState.mode = data.mode;
      touched = true;
    }
    if (typeof data.folder === 'string') {
      folderState.folder = data.folder;
      touched = true;
    } else if (data.folder === null) {
      folderState.folder = '';
      touched = true;
    }
    if (typeof data.canReturn === 'boolean') {
      folderState.canReturn = data.canReturn;
      touched = true;
    }
    if (typeof data.canChooseFolder === 'boolean') {
      folderState.canChooseFolder = data.canChooseFolder;
      touched = true;
    }
    if (touched) folderState.identityChecked = true;
    return touched;
  }

  function reloadWithoutGroupParams() {
    const next = new URL(location.href);
    next.searchParams.delete('group');
    next.searchParams.delete('run');
    next.searchParams.delete('runId');
    if (deskToken) {
      try { sessionStorage.setItem(DESK_TOKEN_KEY, deskToken); } catch (_) {}
      const hashParams = new URLSearchParams(next.hash.slice(1));
      hashParams.set('desk', deskToken);
      next.hash = '#' + hashParams.toString();
    }
    if (next.pathname === location.pathname && next.search === location.search) {
      if (deskToken) history.replaceState(history.state, '', next.pathname + next.search + next.hash);
      location.reload();
    } else {
      location.replace(next.toString());
    }
  }

  async function postFolderApi(path, timeoutMs) {
    const target = new URL(path, location.origin);
    if (target.origin !== location.origin || !FOLDER_API.has(target.pathname)) {
      throw new Error('该请求不属于通信桌');
    }
    const ac = new AbortController();
    let timedOut = false;
    const timer = timeoutMs > 0 ? setTimeout(() => {
      timedOut = true;
      ac.abort();
    }, timeoutMs) : null;
    const headers = { Accept: 'application/json' };
    if (deskToken) headers['X-Via-Desk'] = deskToken;
    let res;
    let raw = '';
    try {
      res = await fetch(target.pathname + target.search, {
        method: 'POST',
        credentials: 'same-origin',
        headers,
        signal: ac.signal,
        redirect: 'error',
        cache: 'no-store',
      });
      raw = await res.text();
    } catch (err) {
      if (timedOut) {
        const timeoutMsg = target.pathname === '/api/folder/select'
          ? '选择文件夹超时，请重试'
          : target.pathname === '/api/folder/open'
            ? '打开项目目录超时，请重试'
            : '返回当前会话超时，请重试';
        throw new Error(timeoutMsg);
      }
      throw err;
    } finally {
      if (timer !== null) clearTimeout(timer);
    }
    let data = null;
    if (raw) {
      try { data = JSON.parse(raw); } catch (_) {}
    }
    if (data && typeof data === 'object') applyFolderMeta(data);
    if (res.status === 401 || res.status === 403) {
      throw new Error('本机入口已失效，请重新打开通信桌');
    }
    if (!res.ok) {
      const serverMsg = data && typeof data === 'object' ? (data.error || data.message || '') : '';
      const fallback = raw ? raw.trim().slice(0, 200) : ('请求失败 (' + res.status + ')');
      throw new Error(String(serverMsg || fallback || ('请求失败 (' + res.status + ')')));
    }
    if (!data || typeof data !== 'object') {
      throw new Error('服务器返回了无效响应');
    }
    return data;
  }

  async function runFolderAction(action, projectId) {
    if (folderState.busy) return;
    const isSelect = action === 'select';
    const isOpen = action === 'open';
    const openId = isOpen ? String(projectId || '').trim() : '';
    if (isOpen && !openId) return;
    const path = isSelect
      ? '/api/folder/select'
      : isOpen
        ? '/api/folder/open?' + new URLSearchParams({ id: openId }).toString()
        : '/api/folder/return';
    const timeoutMs = isSelect
      ? FOLDER_SELECT_TIMEOUT_MS
      : isOpen
        ? FOLDER_OPEN_TIMEOUT_MS
        : FOLDER_RETURN_TIMEOUT_MS;

    folderState.busy = true;
    folderState.action = action;
    folderState.openingProjectId = openId;
    folderState.error = '';
    folderState.notice = '';
    renderFolderBar();
    renderTopMeta();
    renderHistoryProjects();

    let reloading = false;
    try {
      const data = await postFolderApi(path, timeoutMs);
      if (data.changed === false) {
        const msg = (typeof data.message === 'string' && data.message.trim())
          || (typeof data.reason === 'string' && data.reason.trim())
          || (isSelect
            ? '已取消选择文件夹，仍保持当前读取目录。'
            : isOpen
              ? '当前已在该项目目录。'
              : '当前已在会话目录。');
        folderState.notice = msg;
        return;
      }
      reloading = true;
      reloadWithoutGroupParams();
    } catch (err) {
      folderState.error = err && err.message
        ? String(err.message)
        : String(err || (isSelect ? '选择文件夹失败' : isOpen ? '打开项目目录失败' : '返回当前会话失败'));
    } finally {
      if (!reloading) {
        folderState.busy = false;
        folderState.action = '';
        folderState.openingProjectId = '';
        renderFolderBar();
        renderTopMeta();
        renderHistoryProjects();
      }
    }
  }

  function parseEpochMs(value) {
    if (value === null || value === undefined || value === '') return null;
    if (typeof value === 'number') return Number.isFinite(value) ? value : null;
    const raw = String(value).trim();
    if (!raw) return null;
    if (/^\d+$/.test(raw)) {
      const num = Number(raw);
      return Number.isFinite(num) ? num : null;
    }
    const parsed = Date.parse(raw);
    return Number.isFinite(parsed) ? parsed : null;
  }

  function normalizePathForCompare(p) {
    if (typeof p !== 'string') return '';
    const trimmed = p.trim();
    if (!trimmed) return '';
    return trimmed.replace(/[\\/]+$/, '') || trimmed;
  }

  function formatProjectPath(absPath) {
    const raw = typeof absPath === 'string' ? absPath.trim() : '';
    if (!raw) return { name: '', relative: '—', full: '' };
    const clean = raw.replace(/[\\/]+$/, '') || raw;
    const segs = clean.split(/[\\/]+/).filter(Boolean);
    const name = segs.length ? segs[segs.length - 1] : clean;

    const baseClean = normalizePathForCompare(folderState.folder);
    if (baseClean) {
      const anchorSegs = baseClean.split(/[\\/]+/).filter(Boolean);
      let common = 0;
      while (common < anchorSegs.length && common < segs.length && anchorSegs[common] === segs[common]) {
        common++;
      }
      if (common >= 2) {
        const up = anchorSegs.length - common;
        const down = segs.slice(common);
        if (up === 0 && down.length === 0) {
          return { name, relative: name, full: raw };
        }
        if (up <= 2) {
          const rel = (up > 0 ? '../'.repeat(up) : '') + down.join('/');
          return { name, relative: rel || name, full: raw };
        }
      }
    }

    if ((segs[0] === 'Users' || segs[0] === 'home') && segs.length >= 3) {
      return { name, relative: '~/' + segs.slice(2).join('/'), full: raw };
    }
    return { name, relative: clean, full: raw };
  }

  function fmtProjectTime(ms) {
    if (typeof ms !== 'number' || !Number.isFinite(ms)) return '';
    const d = new Date(ms);
    if (Number.isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
      + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function normalizeProjectsList(rawList) {
    const seen = new Set();
    const out = [];
    for (const item of rawList) {
      if (!item || typeof item !== 'object') continue;
      const id = item.id == null ? '' : String(item.id).trim();
      if (!id || seen.has(id)) continue;
      seen.add(id);
      const path = typeof item.path === 'string' ? item.path.trim() : '';
      out.push({
        id,
        path,
        lastCommunicationAt: parseEpochMs(item.lastCommunicationAt),
        lastActivityAt: parseEpochMs(item.lastActivityAt),
      });
    }
    out.sort((a, b) => {
      const aHasComm = a.lastCommunicationAt !== null;
      const bHasComm = b.lastCommunicationAt !== null;
      if (aHasComm !== bHasComm) return aHasComm ? -1 : 1;
      if (aHasComm && bHasComm && a.lastCommunicationAt !== b.lastCommunicationAt) {
        return b.lastCommunicationAt - a.lastCommunicationAt;
      }
      const aHasAct = a.lastActivityAt !== null;
      const bHasAct = b.lastActivityAt !== null;
      if (aHasAct !== bHasAct) return aHasAct ? -1 : 1;
      if (aHasAct && bHasAct && a.lastActivityAt !== b.lastActivityAt) {
        return b.lastActivityAt - a.lastActivityAt;
      }
      return a.path.localeCompare(b.path) || a.id.localeCompare(b.id);
    });
    return out;
  }

  function renderHistoryProjects() {
    if (!$projectsPanel) return;
    const renderKey = JSON.stringify({
      loading: projectsState.loading,
      loaded: projectsState.loaded,
      error: projectsState.error,
      folder: folderState.folder,
      busy: folderState.busy,
      openingId: folderState.openingProjectId,
      items: projectsState.items,
    });
    if (projectsState.lastRenderKey === renderKey) return;
    projectsState.lastRenderKey = renderKey;

    const currentPath = normalizePathForCompare(folderState.folder);
    const countText = projectsState.loaded ? (projectsState.items.length + ' 个') : (projectsState.loading ? '读取中…' : '');
    const refreshBtn = el('button', {
      type: 'button',
      className: 'btn folder-btn',
      disabled: projectsState.loading || folderState.busy,
      onClick: () => { void loadHistoryProjects(); }
    }, projectsState.loading ? '刷新中…' : '刷新列表');

    const head = el('div', { className: 'panel-h' },
      el('div', { className: 'panel-t' },
        el('span', { text: '历史通信项目' }),
        countText ? el('span', { className: 'badge st-hist', text: countText }) : null
      ),
      el('div', { className: 'projects-head-right' },
        el('span', { className: 'projects-hint', text: '按最近通信时间排序 · 点击直接进入该目录的协作组' }),
        refreshBtn
      )
    );

    const body = el('div', { className: 'panel-b' });

    if (projectsState.error && projectsState.items.length > 0) {
      body.appendChild(el('div', { className: 'banner err projects-errbar', role: 'alert' },
        el('span', { text: '项目列表刷新失败：' + projectsState.error }),
        el('button', {
          type: 'button',
          className: 'btn',
          disabled: projectsState.loading || folderState.busy,
          onClick: () => { void loadHistoryProjects(); }
        }, '重试')
      ));
    }

    if (projectsState.loading && !projectsState.loaded && projectsState.items.length === 0) {
      body.appendChild(el('div', { className: 'projects-state', role: 'status', 'aria-live': 'polite' },
        el('span', { text: '正在读取历史通信项目…' })
      ));
    } else if (projectsState.error && projectsState.items.length === 0) {
      body.appendChild(el('div', { className: 'projects-state', role: 'alert' },
        el('span', { text: '历史通信项目加载失败：' + projectsState.error }),
        el('button', {
          type: 'button',
          className: 'btn',
          disabled: projectsState.loading || folderState.busy,
          onClick: () => { void loadHistoryProjects(); }
        }, '重试')
      ));
    } else if (projectsState.items.length === 0) {
      body.appendChild(el('div', { className: 'projects-state' },
        el('span', { text: '暂无历史通信项目' }),
        el('span', { className: 'projects-state-sub', text: '此前有过通信组的项目文件夹会自动列在这里，也可使用上方「选择读取文件夹」手动打开。' })
      ));
    } else {
      const list = el('div', { className: 'projects-list' });
      for (const item of projectsState.items) {
        const pathInfo = formatProjectPath(item.path);
        const displayName = pathInfo.name || item.id;
        const itemPathNorm = normalizePathForCompare(item.path);
        const isCurrent = Boolean(currentPath && itemPathNorm && currentPath === itemPathNorm);
        const isOpening = folderState.busy && folderState.action === 'open' && folderState.openingProjectId === item.id;

        const commTitle = item.lastCommunicationAt !== null
          ? '最近通信：' + fmtDateTime(item.lastCommunicationAt)
            + (item.lastActivityAt !== null && item.lastActivityAt !== item.lastCommunicationAt
              ? ' · 最近活动：' + fmtDateTime(item.lastActivityAt)
              : '')
          : '';
        const commEl = item.lastCommunicationAt !== null
          ? el('span', {
            className: 'project-comm mono',
            title: commTitle,
            text: '最近通信 ' + fmtProjectTime(item.lastCommunicationAt),
          })
          : el('span', { className: 'project-comm is-none', text: '暂无通信' });

        const actEl = item.lastCommunicationAt === null && item.lastActivityAt !== null
          ? el('span', {
            className: 'project-act mono',
            title: '最近活动：' + fmtDateTime(item.lastActivityAt),
            text: '最近活动 ' + fmtProjectTime(item.lastActivityAt),
          })
          : null;

        const rowBtn = el('button', {
          type: 'button',
          className: 'project-row' + (isCurrent ? ' is-current' : ''),
          title: pathInfo.full || displayName,
          disabled: folderState.busy,
          'aria-current': isCurrent ? 'true' : null,
          'aria-busy': isOpening ? 'true' : null,
          onClick: () => { void runFolderAction('open', item.id); }
        },
          el('span', { className: 'project-title' },
            el('span', { className: 'project-name', text: displayName }),
            isCurrent ? el('span', { className: 'badge st-hist', text: '当前目录' }) : null,
            isOpening ? el('span', { className: 'badge st-working', text: '切换中…' }) : null
          ),
          el('span', {
            className: 'project-path mono',
            title: pathInfo.full || pathInfo.relative,
            text: pathInfo.relative,
          }),
          el('span', { className: 'project-times' }, commEl, actEl)
        );
        list.appendChild(rowBtn);
      }
      body.appendChild(list);
    }

    $projectsPanel.textContent = '';
    $projectsPanel.appendChild(head);
    $projectsPanel.appendChild(body);
  }

  async function loadHistoryProjects() {
    abortKey('projects');
    const ac = new AbortController();
    S.aborts.projects = ac;
    const reqId = ++projectsState.reqId;

    projectsState.loading = true;
    projectsState.error = '';
    renderHistoryProjects();

    try {
      const data = await fetchJson('/api/folder/projects', ac.signal);
      if (ac.signal.aborted || reqId !== projectsState.reqId) return;
      if (!data || typeof data !== 'object' || !Array.isArray(data.projects)) {
        throw new Error('服务器返回了无效的项目列表');
      }
      projectsState.items = normalizeProjectsList(data.projects);
      projectsState.loaded = true;
      projectsState.loading = false;
      projectsState.error = '';
      renderHistoryProjects();
    } catch (err) {
      if (ac.signal.aborted || reqId !== projectsState.reqId || isAbortError(err)) return;
      projectsState.loading = false;
      projectsState.error = err && err.message ? String(err.message) : String(err || '加载失败');
      renderHistoryProjects();
    } finally {
      if (S.aborts.projects === ac) S.aborts.projects = null;
    }
  }

  function renderFolderBar() {
    if (!$folderBar) return;
    const inFolderMode = folderState.mode === 'folder';
    const showChoose = folderState.canChooseFolder;
    const showReturn = inFolderMode && folderState.canReturn;
    const visible = Boolean(folderState.folder || showChoose || showReturn || folderState.busy || folderState.error || folderState.notice);
    $folderBar.hidden = !visible;
    renderHistoryProjects();
    if (!visible) return;

    $folderBar.classList.toggle('is-folder-mode', inFolderMode);
    $folderModeBadge.textContent = inFolderMode ? '只读历史' : '当前会话';
    $folderModeBadge.className = 'folder-mode-badge ' + (inFolderMode ? 'is-folder' : 'is-session');

    const relative = folderState.folder.replace(/^\/(?:Users|home)\/[^/]+/, '~');
    const pathText = relative.length > 48 ? '…/' + relative.split('/').at(-1) : relative || '—';
    if ($folderPath.textContent !== pathText) $folderPath.textContent = pathText;
    if ($folderPath.title !== folderState.folder) $folderPath.title = folderState.folder;

    $chooseFolderBtn.hidden = !showChoose;
    $chooseFolderBtn.disabled = folderState.busy;
    if (folderState.busy && folderState.action === 'select') {
      $chooseFolderBtn.setAttribute('aria-busy', 'true');
      $chooseFolderBtn.textContent = '选择中…';
    } else {
      $chooseFolderBtn.removeAttribute('aria-busy');
      $chooseFolderBtn.textContent = '选择读取文件夹';
    }

    $returnSessionBtn.hidden = !showReturn;
    $returnSessionBtn.disabled = folderState.busy;
    if (folderState.busy && folderState.action === 'return') {
      $returnSessionBtn.setAttribute('aria-busy', 'true');
      $returnSessionBtn.textContent = '返回中…';
    } else {
      $returnSessionBtn.removeAttribute('aria-busy');
      $returnSessionBtn.textContent = '返回当前会话';
    }

    const busyText = folderState.busy
      ? (folderState.action === 'select'
        ? '请在系统文件夹选择器中选定目录…'
        : folderState.action === 'open'
          ? '正在切换至选定项目目录…'
          : '正在切回当前会话目录…')
      : '';
    if (busyText) {
      $folderStatus.hidden = false;
      $folderStatus.className = 'folder-status is-info';
      $folderStatus.setAttribute('role', 'status');
